/* ── ANTEPRIME ───────────────────────────────────────
   L'anteprima e' il componente vero, reso e rimpicciolito: non puo' mentire, e un
   tipo nuovo non porta con se' nessun disegno da mantenere. */
function uxThumb(t){
  const k = UXK[t];
  if(!k) return '';
  /* Regola: l'anteprima e' il componente vero rimpicciolito, e non puo' mentire.
     L'eccezione e' il componente troppo fitto per reggere la scala — una pagina di
     back-office a 0.1 diventa polvere. Li' la voce dichiara un `th`: uno skeleton
     con le stesse proporzioni, reso piu' grande perche' l'ingombro resti leggibile. */
  return '<span class="th' + (k.th ? ' sk' : '') + '"><span class="in">' +
    (k.th ? k.th() : k.d({n:k.l, goal:'Una riga di testo, per capire il peso.'})) + '</span></span>';
}

/* la palette, raggruppata */
function uxPalette(s){
  const ks = uxTypes(s), gs = [];
  ks.forEach(k => { if(gs.indexOf(UXK[k].g) < 0) gs.push(UXK[k].g); });
  return '<div class="uxpal">' + gs.map(g =>
    '<div class="gr">' + g + '</div><div class="bs">' +
      ks.filter(k => UXK[k].g === g).map(k =>
        '<span class="it" role="button" tabindex="0" data-uxdo="new:' + k + '" title="' + esc(UXK[k].l) + '">' +
          uxThumb(k) + '<span class="nm">' + UXK[k].l +
          (UXK[k].r ? '<b class="rl">' + UXK[k].r + '</b>' : '') + '</span></span>').join('') +
    '</div>').join('') + '</div>';
}

function uxMark(html, u, i, draft, quiet){
  const ne = html.search(/[\s>\/]/), open = html.indexOf('>') + 1;
  if(quiet)                       /* solo l'aggancio: niente numero, niente fumetto */
    return html.slice(0, ne) + ' data-ux="' + i + '" data-uxk="' + u._k + '"' + (draft ? ' data-uxdraft="1"' : '') +
      html.slice(ne, open) + pinsIn(u) + html.slice(open);
  return html.slice(0, ne) + ' data-ux="' + i + '" data-uxk="' + u._k + '" data-uxdrop="' + i + '"' + (S.uxSel === i ? ' data-uxon="1"' : '') + (draft ? ' data-uxdraft="1"' : '') +
    html.slice(ne, open) + pinsIn(u) +
    '<span class="uxn' + (u.st === 'rivedi' ? ' rv' : u.st === 'nuovo' ? ' nw' : '') + ((u.note || []).concat(u.todo || []).filter(Boolean).length ? ' has' : '') +
      '" draggable="true" data-uxdrag="' + i + '" data-uxsel="' + i + '" title="' + esc(u.n || '') + ' \u2014 clicca per gli appunti, trascina per spostare">' + (i + 1) + '</span>' +
    (S.uxSel === i ? uxCall(u, i) : '') +
    html.slice(open);
}
/* fumetto agganciato alla sezione: nome, scopo, osservazioni e cose da fare,
   li' dove stai guardando invece che solo nella colonna di destra */
function uxCall(u, i){
  const st = u.st || 'ok';
  const li = a => (a || []).filter(Boolean).length
    ? '<ul>' + a.filter(Boolean).map(x => '<li>' + x + '</li>').join('') + '</ul>' : '';
  return '<div class="uxcall">' +
    '<div class="h"><b>' + (u.n || 'Sezione') + '</b>' +
      tag(UXST[st], UXSTC[st]) +
      '<button data-uxdo="sotto" data-uxi="' + i + '" title="Aggiungi una sezione sotto questa">+</button>' +
      '<button data-uxsel="' + i + '" title="Chiudi">\u00d7</button></div>' +
    (u.goal ? '<p>' + u.goal + '</p>' : '') +
    li(u.note) + (u.todo && u.todo.filter(Boolean).length ? '<div class="td">' + li(u.todo) + '</div>' : '') +
  '</div>';
}
function uxGhost(u, i){
  return '<div class="uxg" data-ux="' + i + '" data-uxdrop="' + i + '"' + (S.uxSel === i ? ' data-uxon="1"' : '') + '>' +
    '<span class="uxn nw" draggable="true" data-uxdrag="' + i + '" data-uxsel="' + i + '" title="Trascina per spostare la sezione">' + (i + 1) + '</span>' +
    '<b>' + (u.n || 'Sezione senza nome') + '</b>' + (u.goal ? '<span>' + u.goal + '</span>' : '') +
    '<em>sezione proposta &middot; non ancora disegnata</em></div>';
}
/* rende i blocchi nell'ordine della lista: spostare una voce sposta la sezione */
function uxApply(html, s, silent){
  const b = uxBlocks(html), src = uxBase(s), own = {};
  src.filter(u => u.st !== 'nuovo' && uxRole(u)).forEach((u, j) => { own[u._k == null ? src.indexOf(u) : u._k] = j; });
  const list = uxVis(s), used = {};
  let out = '', orphan = 0;
  list.forEach((u, i) => {
    const j = u._k == null ? undefined : own[u._k];
    u._draft = (j === undefined || !b[j]);
    if(u._draft){
      if(u.st === 'tolta') return;                                /* proposta ritirata */
      if(u.t) out += uxMark(uxDraft(u), u, i, true, silent);      /* disegnata: si vede sempre */
      else if(!silent) out += uxGhost(u, i);                      /* solo appunto: vive nell'editor */
      return;
    }
    used[j] = 1;
    if(u.st === 'tolta') return;        /* il blocco esiste nella view() ma la pagina non lo mostra */
    out += uxMark(html.slice(b[j][0], b[j][1]), u, i, false, silent);
  });
  b.forEach((blk, j) => { if(!used[j]){ orphan++; out += html.slice(blk[0], blk[1]); } });
  return {html:out, list:list, blocks:b.length, orphan:orphan};
}

/* l'ordine deciso nell'editor vale anche a editor spento: e' l'ordine della pagina */
const uxOrder = (html, s) => uxApply(html, s, true).html;

/* ── scheda modificabile ── */
const uxEd = (v, f, i, ph) =>
  '<span contenteditable="true" data-uxf="' + f + '" data-uxi="' + i + '" data-ph="' + esc(ph || '') + '">' + (v || '') + '</span>';

const UXST = {ok:'tiene', rivedi:'da rivedere', nuovo:'da aggiungere', tolta:'tolta'};
const UXSTC = {ok:'ok', rivedi:'k', nuovo:'x', tolta:'ko'};

/* La scheda ha due stati: chiusa e' una riga da scorrere (numero, nome, stato),
   aperta e' il posto dove si lavora, con i campi etichettati. Una alla volta. */
function uxCard(u, i){
  const st = u.st || 'ok', aperta = S.uxSel === i;
  const n = '<span class="uxn' + (st === 'rivedi' ? ' rv' : st === 'nuovo' || st === 'tolta' ? ' nw' : '') +
    ((u.note || []).concat(u.todo || []).filter(Boolean).length ? ' has' : '') +
    '" draggable="true" data-uxdrag="' + i + '" data-uxsel="' + i + '" title="Trascina per spostare">' + (i + 1) + '</span>';

  if(st === 'tolta') return '<div class="uxc via" data-uxdrop="' + i + '">' +
    '<div class="hd">' + n + '<span class="nm">' + (u.n || 'Sezione') + '</span>' +
      '<span class="tag ko">tolta</span>' +
      '<button class="ico" data-uxdo="torna" data-uxi="' + i + '" title="Rimetti la sezione">\u21ba</button>' +
      '<button class="ico" data-uxdo="del" data-uxi="' + i + '" title="Togli anche la voce">\u00d7</button></div></div>';

  if(!aperta) return '<div class="uxc" data-uxdrop="' + i + '">' +
    '<div class="hd" data-uxsel="' + i + '">' + n +
      '<span class="nm">' + (u.n || 'Sezione senza nome') + '</span>' +
      '<span class="tag ' + UXSTC[st] + '">' + UXST[st] + '</span></div></div>';

  const campo = (et, corpo) => '<div class="f"><label>' + et + '</label>' + corpo + '</div>';
  const righe = (k, arr) => '<ul class="uxl' + (k === 'todo' ? ' todo' : '') + '">' +
    (arr || []).map((x, j) => '<li>' + uxEd(x, k + ':' + j, i, 'riga vuota = si cancella') + '</li>').join('') +
    '</ul><button class="piu" data-uxdo="+' + k + '" data-uxi="' + i + '">+ aggiungi</button>';

  return '<div class="uxc on" data-uxdrop="' + i + '">' +
    '<div class="hd" data-uxsel="' + i + '">' + n +
      '<span class="nm">' + uxEd(u.n, 'n', i, 'nome della sezione') + '</span>' +
      '<span class="tag ' + UXSTC[st] + '">' + UXST[st] + '</span></div>' +
    '<div class="bd">' +
      campo('A cosa serve', uxEd(u.goal, 'goal', i, 'scrivilo in una riga: se non sai dirlo, la sezione non serve')) +
      campo('Stato', '<span class="seg">' + ['ok', 'rivedi', 'nuovo'].map(k =>
        '<button' + (st === k ? ' class="on"' : '') + ' data-uxdo="st:' + k + '" data-uxi="' + i + '">' + UXST[k] + '</button>').join('') + '</span>') +
      (u._draft ? campo('Che forma ha', (u.t ? '<span class="thbox">' + uxThumb(u.t) + '</span>' : '') +
        '<select class="uxt" data-uxt="' + i + '">' +
        '<option value="">solo appunto, non disegnarla</option>' +
        uxTypes(scr(S.screen)).map(t => '<option value="' + t + '"' + (u.t === t ? ' selected' : '') + '>' + UXK[t].l + '</option>').join('') +
        '</select>') : '') +
      campo('Cosa si osserva', righe('note', u.note)) +
      campo('Cosa fare', righe('todo', u.todo)) +
      '<div class="az">' +
        '<button data-uxdo="up" data-uxi="' + i + '" title="Sposta su">\u2191</button>' +
        '<button data-uxdo="dn" data-uxi="' + i + '" title="Sposta gi\u00f9">\u2193</button>' +
        '<button data-uxdo="dup" data-uxi="' + i + '">duplica</button>' +
        '<button data-uxdo="sotto" data-uxi="' + i + '">sezione sotto</button>' +
        '<button class="ko" data-uxdo="del" data-uxi="' + i + '">togli</button>' +
      '</div>' +
    '</div></div>';
}

function uxPanel(s, info){
  const l = info.list;
  const da = l.filter(u => (u.st || 'ok') === 'rivedi' || (u.st || 'ok') === 'nuovo').length;
  const tolte = l.filter(u => u.st === 'tolta').length;
  return '<div class="uxtop">' +
    '<button class="btn pri wide' + (S.pal ? ' on' : '') + '" data-uxdo="add">+ Aggiungi sezione</button>' +
    '<div class="sum">' + l.length + ' sezioni \u00b7 ' + (da ? da + ' da lavorare' : 'tutte a posto') +
      (tolte ? ' \u00b7 ' + tolte + ' tolta' + (tolte > 1 ? 'e' : '') : '') + '</div>' +
    (S.pal ? uxPalette(s) : '') +
  '</div>' +
  (info.orphan ? '<div class="note">' + info.orphan + ' blocchi resi non hanno una voce.</div>' : '') +

function uxTag(x){
  const l = (S.uxEd[x.id] || x.ux || []).filter(uxRole);
  if(!l.length) return 'ux —';

  return open ? open + '/' + l.length : 'ok';
}

/* ── modifiche ── */
function uxAt(i){                     /* dalla posizione visibile alla voce vera */
  const s = scr(S.screen), all = uxEnsure(s), u = uxVis(s)[i];
  return {s:s, all:all, u:u, k:all.indexOf(u)};
}
const UXMUT = {inkundo:'togli tratto', inkclear:'cancella disegni', 'st:ok':'stato', 'st:rivedi':'stato', 'st:nuovo':'stato', del:'togli sezione', torna:'rimetti sezione', dup:'duplica', up:'sposta', dn:'sposta', '+note':'osservazione', '+todo':'da fare', pindel:'togli segno', pinclear:'pulisci segni', stclear:'scarta tutto'};
function uxDo(k, i){
  const s = scr(S.screen);
  if(UXMUT[k] || k.indexOf('new:') === 0) snap(UXMUT[k] || 'sezione nuova');
  if(k === 'add'){ S.pal = !S.pal; return; }
  if(k.indexOf('new:') === 0){
    const t = k.slice(4), all = uxEnsure(s), sel = S.uxSel != null ? uxVis(s)[S.uxSel] : null;
    const u = {n:UXK[t].l, goal:'', st:'nuovo', t:t, note:[], todo:[], _k:null};
    all.splice(sel ? all.indexOf(sel) + 1 : all.length, 0, u);
    S.pal = false; S.uxSel = uxVis(s).indexOf(u);
    return;
  }
  if(k === 'copy') return uxCopy(s);
  if(k === 'pindel'){ pinsOf(s).splice(+i, 1); S.pinSel = null; return; }
  if(k === 'inkundo'){ const l = inksOf(s); for(let i = l.length - 1; i >= 0; i--) if(inkVis(l[i])){ l.splice(i, 1); break; } return; }
  if(k === 'inkclear'){ S.inks[s.id] = inksOf(s).filter(x => !inkVis(x)); return; }
  if(k === 'pinclear'){ S.pins[s.id] = pinsOf(s).filter(p => !pinVis(p)); S.pinSel = null; return; }
  if(k === 'txcopy') return txtCopy();
  if(k === 'redo') return redo();
  if(k.indexOf('time:') === 0) return timeGo(+k.slice(5));
  if(k === 'stclear') return stClear();
  if(k === 'txdel'){ const ks = Object.keys(S.txtEd[S.screen] || {}); delete S.txtEd[S.screen][ks[+i]]; return; }
  if(k === 'reset'){ delete S.uxEd[s.id]; S.uxSel = null; return; }
  const c = uxAt(+i); if(!c.u) return;
  if(k.indexOf('st:') === 0){ c.u.st = k.slice(3); return; }
  if(k === 'del'){
    if(c.u._k == null || c.u.st === 'tolta') c.all.splice(c.k, 1);   /* proposta: via del tutto */
    else c.u.st = 'tolta';                                           /* sezione vera: sparisce dalla pagina */
    S.uxSel = null; return;
  }
  if(k === 'torna'){ c.u.st = 'ok'; return; }
  if(k === 'dup'){
    const d = Object.assign({}, c.u, {_k:null, st:'nuovo', n:c.u.n + ' (copia)',
      note:(c.u.note || []).slice(), todo:(c.u.todo || []).slice()});
    c.all.splice(c.k + 1, 0, d);
    S.uxSel = uxVis(s).indexOf(d);
    return;
  }
  if(k === 'sotto'){ S.uxSel = +i; S.pal = true; return; }
  if(k === '+note'){ (c.u.note = c.u.note || []).push(''); return; }
  if(k === '+todo'){ (c.u.todo = c.u.todo || []).push(''); return; }
  if(k === 'up' || k === 'dn'){
    const j = c.k + (k === 'up' ? -1 : 1);
    if(j < 0 || j >= c.all.length) return;
    c.all.splice(j, 0, c.all.splice(c.k, 1)[0]);
    S.uxSel = uxVis(s).indexOf(c.u);
  }
}
/* trascinamento: dalla posizione visibile a quella vera, e la sezione si muove davvero */
function uxMove(a, b){
  const s = scr(S.screen), all = uxEnsure(s), vis = uxVis(s), ua = vis[a], ub = vis[b];
  if(!ua || !ub || ua === ub) return;
  snap('sposta sezione');
  all.splice(all.indexOf(ua), 1);
  all.splice(all.indexOf(ub) + (a > b ? 0 : 1), 0, ua);
  S.uxSel = uxVis(s).indexOf(ua);
}
function uxSet(i, f, v){
  const c = uxAt(+i); if(!c.u) return;
  const p = f.split(':');
  if(p.length === 1) c.u[p[0]] = v; else c.u[p[0]][+p[1]] = v;
}

/* ── il blocco da incollare nello spec ── */
function uxDumpList(s, orig){
  return (orig ? uxBase(s).map(u => Object.assign({}, u, {_k:null})) : uxEnsure(s))
    .map(u => ({n:u.n, st:u.st || 'ok', roles:u.roles || null, goal:u.goal || '', t:u.t || null,
                note:(u.note || []).filter(Boolean), todo:(u.todo || []).filter(Boolean)}));
}
function uxCopy(s){
  const q = t => "'" + String(t).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
  const arr = a => '[' + a.map(q).join(', ') + ']';
  const l = uxDumpList(s);
  const body = l.map(u => '  {n:' + q(u.n) + (u.st !== 'ok' ? ', st:' + q(u.st) : '') +
      (u.t ? ', t:' + q(u.t) : '') + (u.roles ? ', roles:' + arr(u.roles) : '') + ', goal:' + q(u.goal) +
      (u.note.length ? ',\n   note:' + arr(u.note) : '') +
      (u.todo.length ? ',\n   todo:' + arr(u.todo) : '') + '}').join(',\n');
  /* se le sezioni sono state spostate, anche la view() va riordinata: il check lo pretende */
  const ord = uxEnsure(s).map(u => u._k).filter(k => k != null);
  const moved = ord.some((k, j) => j && k < ord[j - 1]);
  const bozze = uxEnsure(s).filter(u => u._draft && u.t);
  const pins = pinsOf(s).filter(p => p.t);
  const pinTxt = pins.length ? '\n pins:[\n' + pins.map(p =>
    '  {x:' + p.x + ', y:' + p.y + ', t:' + q(p.t) + '}').join(',\n') + '\n ],' : '';
  const src = t => (UXK[t] || {}).s || '';
  const txt = (moved ? '/* ordine dei blocchi cambiato: riordina anche view() nello stesso ordine */\n' : '') +
    (uxEnsure(s).length ? ' ux:[\n' + body + '\n ],' : '') + pinTxt +
    (bozze.length ? '\n\n/* da incollare in view(), al posto giusto:\n' +
      bozze.map(u => '   ' + src(u.t).replace('%H', q(u.n)).replace('%P', q(u.goal || ''))).join(' +\n') + '\n*/' : '');
  const done = () => { log('Copiato il blocco ux di ' + s.label); toast('Copiato: incollalo in progetti/<progetto>/spec.js, dentro la schermata "' + s.id + '".'); };
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(done, () => uxCopyFallback(txt, done));
  uxCopyFallback(txt, done);
}
function uxCopyFallback(txt, done){
  const t = document.createElement('textarea');
  t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  t.remove();
  ok ? done() : toast('Copia non riuscita: il blocco e’ nella console.', true) || console.log(txt);
}

/* ── TESTI ───────────────────────────────────────────
   Editor dei testi del wireframe. Si scrive direttamente nella pagina; la modifica
   resta in memoria, riappare a ogni render e parte con l'export. Non torna da sola
   nello spec: "Copia modifiche" dà la lista vecchio -> nuovo da applicare a view().
   ponytail: la chiave e' il testo originale, non un percorso nel DOM. Due elementi
   con lo stesso testo cambiano insieme — per un wireframe va bene, ed e' esattamente
   la sostituzione che poi fai nello spec. */
const TXTSEL = 'h1,h2,h3,h4,h5,p,button,li,td,th,b,small,.kick,.meta,summary span';
function txtMap(){ return S.txtEd[S.screen] || (S.txtEd[S.screen] = {}); }
/* riapplica le modifiche dopo ogni render, e accende la scrittura se il modo e' attivo */
function txtPaint(){
  const page = $('.page'); if(!page) return;
  const m = S.txtEd[S.screen] || {};
  page.querySelectorAll(TXTSEL).forEach(el => {
    if(el.firstElementChild || el.closest('.uxg') || el.closest('.pinl')) return;   /* solo foglie di testo */
    const k = el.textContent.trim();
    if(!k) return;
    el.setAttribute('data-txo', k);
    if(m[k] != null && m[k] !== k){ el.textContent = m[k]; el.classList.add('txch'); }
    if(S.txt){ el.setAttribute('contenteditable', 'true'); el.classList.add('tx'); }
  });
}
function txtSet(el){
  const k = el.getAttribute('data-txo'), v = el.textContent.trim(), m = txtMap();
  if(v === k || !v) delete m[k]; else m[k] = v;
}
function txtPanel(){
  const m = S.txtEd[S.screen] || {}, ks = Object.keys(m);
  return (S.txt ? '<div class="note">Modo testi acceso: scrivi direttamente sul wireframe.</div>' : '') +
    (ks.length
      ? '<ol class="txlist">' + ks.map((k, i) =>
          '<li><span class="o">' + esc(k) + '</span><span class="n">' + esc(m[k]) + '</span>' +
          '<button data-uxdo="txdel" data-uxi="' + i + '" title="Rimetti l\u2019originale">\u00d7</button></li>').join('') + '</ol>' +
        '<div class="uxbar"><button class="btn sm" data-uxdo="txcopy">Copia modifiche \u29c9</button></div>'
      : '<div class="empty">Nessun testo cambiato.' + (S.txt ? '' : ' Accendi <b>testi</b> nella barra in alto.') + '</div>');
}
function txtCopy(){
  const m = S.txtEd[S.screen] || {}, ks = Object.keys(m), s = scr(S.screen);
  if(!ks.length){ toast('Nessun testo cambiato su questa schermata.', true); return; }
  const q = t => "'" + String(t).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
  const txt = '/* testi da sostituire nella view() della schermata "' + s.id + '" */\n' +
    ks.map(k => '   ' + q(k) + '\n\u2192  ' + q(m[k])).join('\n\n');
  const done = () => { log('Copiate ' + ks.length + ' modifiche di testo'); toast(ks.length + ' modifiche copiate: sostituiscile nella view() di "' + s.id + '".'); };
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(done, () => uxCopyFallback(txt, done));
  uxCopyFallback(txt, done);
}

/* ── MATITA LIBERA ───────────────────────────────────
   Scarabocchi sopra il wireframe: frecce, cerchi, croci. Coordinate normalizzate
   0-1000 sui due assi con preserveAspectRatio="none", cosi' il disegno segue la
   pagina quando cambia larghezza; il tratto resta sottile (vector-effect).
   Come i segni, appartengono alla vista in cui li fai. */
function inksOf(s){
  if(!S.inks[s.id]) S.inks[s.id] = (s.inks || []).map(x => Object.assign({}, x));
  return S.inks[s.id];
}
const inkVis = x => !!x.m === !!S.mob;
function inkLayer(s){
  const l = inksOf(s).filter(inkVis);
  if(!l.length && !S.draw) return '';
  return '<svg class="ink' + (S.draw ? ' on' : '') + '" viewBox="0 0 1000 1000" preserveAspectRatio="none">' +
    l.map(x => '<path d="' + x.d + '" vector-effect="non-scaling-stroke"/>').join('') + '</svg>';
}
function inkPanel(s){
  const tutti = inksOf(s), l = tutti.filter(inkVis), altri = tutti.length - l.length;
  return '<div class="pinvis">Disegni della vista <b>' + (S.mob ? 'mobile' : 'desktop') + '</b>' +
      (altri ? ' \u00b7 ne hai ' + altri + ' su ' + (S.mob ? 'desktop' : 'mobile') : '') + '</div>' +
    (l.length
      ? '<div class="inkbar"><span>' + l.length + ' tratti</span>' +
          '<button class="btn sm" data-uxdo="inkundo">togli l\u2019ultimo</button>' +
          '<button class="btn sm" data-uxdo="inkclear">cancella tutti</button></div>'
      : '<div class="empty">Nessun disegno qui. Con la matita accesa si traccia direttamente sul wireframe: frecce, cerchi, croci.</div>');
}
/* il tratto si disegna dal vivo dentro il livello, senza ridisegnare la pagina */
document.addEventListener('pointerdown', e => {
  if(!S.draw) return;
  const svg = e.target.closest('.page') && $('.ink');
  if(!svg) return;
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const xy = ev => ((ev.clientX - r.left) / r.width * 1000).toFixed(1) + ' ' + ((ev.clientY - r.top) / r.height * 1000).toFixed(1);
  let d = 'M' + xy(e);
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('vector-effect', 'non-scaling-stroke');
  svg.appendChild(path);
  const mv = ev => { d += 'L' + xy(ev); path.setAttribute('d', d); };
  const up = () => {
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
    if(d.indexOf('L') < 0) return path.remove();      /* un clic solo non e' un tratto */
    snap('disegno');
    const x = {d:d};
    if(S.mob) x.m = 1;
    inksOf(scr(S.screen)).push(x);
    setTimeout(render, 0);
  };
  document.addEventListener('pointermove', mv);
  document.addEventListener('pointerup', up);
});

/* ── GESTI DELLA TELA ────────────────────────────────
   Tre gesti su un solo pointerdown, scelti dallo strumento acceso. Nessuno di loro
   chiama render(): il tratto nasce gia' nel DOM e la transform si aggiorna da sola,
   cosi' la tela non sfarfalla e un appunto aperto non perde il cursore. */
document.addEventListener('pointerdown', e => {
  if(!S.arch) return;
  const cv = e.target.closest('.archcv');
  if(!cv || e.target.closest('.dock')) return;

  /* col cursore il clic sceglie invece di scrivere o di spostare: un tratto, un
     appunto, o niente. Lo sfondo continua a trascinare la tela. */
  if(S.atool === 'sel'){
    const g = e.target.closest('[data-ai]'), n = e.target.closest('[data-anote]');
    if((g || n) && !e.target.closest('button')){
      e.preventDefault();
      const el = g || n, k = g ? 'ink' : 'txt', i = +(g ? g.dataset.ai : n.dataset.anote);
      S.asel = {k:k, i:i};
      /* la selezione si mostra a mano: un render qui butterebbe via l'elemento che
         stiamo per trascinare. La barra si aggiorna al rilascio. */
      document.querySelectorAll('.aink g.on,.anote.on').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      const z = S.arc.z, cx = e.clientX, cy = e.clientY;
      const x0 = k === 'txt' ? S.arc.txt[i].x : 0, y0 = k === 'txt' ? S.arc.txt[i].y : 0;
      let dx = 0, dy = 0, mosso = false;
      const mv = ev => {
        dx = Math.round((ev.clientX - cx) / z); dy = Math.round((ev.clientY - cy) / z);
        if(!mosso && Math.abs(dx) + Math.abs(dy) < 3) return;   /* un tremolio non e' uno spostamento */
        mosso = true;
        if(k === 'txt'){ el.style.left = (x0 + dx) + 'px'; el.style.top = (y0 + dy) + 'px'; }
        else el.setAttribute('transform', 'translate(' + dx + ',' + dy + ')');
      };
      const up = () => {
        document.removeEventListener('pointermove', mv);
        document.removeEventListener('pointerup', up);
        if(!mosso) return render();
        snap('sposta');
        if(k === 'txt'){ S.arc.txt[i].x = x0 + dx; S.arc.txt[i].y = y0 + dy; }
        else S.arc.ink[i] = arcMove(S.arc.ink[i], dx, dy);
        render(); stSave();
      };
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
      return;
    }
    if(S.asel){ S.asel = null; render(); }
  } else if(e.target.closest('.anote')) return;

  if(S.atool === 'txt') return;      /* l'appunto lo fa il clic, piu' sotto */

  if(S.atool === 'pen'){
    const svg = $('.aink');
    if(!svg) return;
    e.preventDefault();
    const p0 = arcXY(e);
    let d = 'M' + p0.x + ' ' + p0.y;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(path);
    const mv = ev => { const p = arcXY(ev); d += 'L' + p.x + ' ' + p.y; path.setAttribute('d', d); };
    const up = () => {
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      if(d.indexOf('L') < 0) return path.remove();      /* un clic solo non e' un tratto */
      snap('tratto');
      S.arc.ink.push(d);
      stSave();
    };
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    return;
  }

  /* sposta: il nodo si clicca lo stesso, trascinare sullo sfondo muove la tela */
  if(e.target.closest('.nd')) return;
  e.preventDefault();
  const x0 = S.arc.x, y0 = S.arc.y, cx = e.clientX, cy = e.clientY;
  cv.classList.add('grab');
  const mv = ev => { S.arc.x = x0 + (ev.clientX - cx); S.arc.y = y0 + (ev.clientY - cy); arcApply(); };
  const up = () => {
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
    cv.classList.remove('grab');
  };
  document.addEventListener('pointermove', mv);
  document.addEventListener('pointerup', up);
});

/* Il trackpad manda due gesti diversi sullo stesso evento: due dita che scorrono
   arrivano con ctrlKey falso, il pizzico lo manda vero (lo sintetizza il browser).
   Quindi due dita spostano la tela, e pizzicare avvicina. Lo zoom e' esponenziale
   sul delta, con il delta limitato: cosi' il pizzico del trackpad e' continuo e un
   colpo di rotella del mouse resta un passo solo. */
document.addEventListener('wheel', e => {
  if(!S.arch || !e.target.closest('.archcv')) return;
  e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : 1;          /* alcuni browser contano righe, non px */
  if(e.ctrlKey || e.metaKey){
    const d = Math.max(-20, Math.min(20, e.deltaY * k));
    arcZoom(S.arc.z * Math.exp(-d * .01), e.clientX, e.clientY);
    return;
  }
  S.arc.x -= e.deltaX * k;
  S.arc.y -= e.deltaY * k;
  arcApply();
}, {passive:false});

/* chiuso l'appunto si salva; se non ci hai scritto niente non esiste e sparisce */
document.addEventListener('focusout', e => {
  const n = e.target.closest ? e.target.closest('[data-anote]') : null;
  if(!n || !S.arch) return;
  const i = +n.dataset.anote, t = S.arc.txt[i];
  if(!t) return;
  t.t = (e.target.textContent || '').trim();
  if(!t.t){ S.arc.txt.splice(i, 1); render(); return; }
  stSave();
});

/* l'appunto si scrive dentro la tela: si salva mentre scrivi, senza ridisegnare */
document.addEventListener('input', e => {
  const n = e.target.closest ? e.target.closest('[data-anote]') : null;
  if(!n || !S.arch) return;
  const t = S.arc.txt[+n.dataset.anote];
  if(t){ t.t = e.target.textContent; stSave(); }
});

/* ── MATITA ROSSA ────────────────────────────────────
   Segni su un punto preciso del wireframe. Coordinate in % della pagina, quindi
   reggono il cambio di ruolo e la larghezza dello schermo. Vivono in memoria come
   le modifiche ux, partono con l'export, e si fissano nello spec con
   pins:[{x, y, t}] sulla schermata. */
/* desktop e mobile hanno segni diversi: quello che non va su uno spesso non e' un
   problema sull'altro. Un segno nato in mobile porta m:1 e si vede solo li'. */
const pinVis = p => !!p.m === !!S.mob;
function pinsOf(s){
  if(!S.pins[s.id]) S.pins[s.id] = (s.pins || []).map(p => Object.assign({}, p));
  return S.pins[s.id];
}
/* i segni di un blocco stanno dentro il blocco, con coordinate sue: cosi' passando
   da desktop a mobile il segno resta attaccato al componente, non al punto. */
function pinsIn(u){
  const l = pinsOf(scr(S.screen));
  const mie = l.map((p, i) => [p, i]).filter(x => x[0].b != null && x[0].b === u._k && pinVis(x[0]));
  return mie.length ? '<div class="pinl in' + (S.pen ? ' on' : '') + '">' + mie.map(x => pinOne(x[0], x[1])).join('') + '</div>' : '';
}
function pinOne(p, i){
  return '<span class="pin' + (S.pinSel === i ? ' on' : '') + '" style="left:' + p.x + '%;top:' + p.y + '%" ' +
    'data-pin="' + i + '" title="' + esc(p.t || 'segno senza testo') + '">' + (i + 1) + '</span>' +
    (S.pinSel === i
      ? '<div class="pincall" style="left:' + p.x + '%;top:' + p.y + '%">' +
          '<span contenteditable="true" data-pinf="' + i + '" data-ph="cosa non va qui">' + (p.t || '') + '</span>' +
          '<button data-uxdo="pindel" data-uxi="' + i + '" title="Togli il segno">\u00d7</button></div>'
      : '');
}
function pinLayer(s){
  const l = pinsOf(s).map((p, i) => [p, i]).filter(x => x[0].b == null && pinVis(x[0]));
  if(!l.length && !S.pen) return '';
  return '<div class="pinl' + (S.pen ? ' on' : '') + '">' + l.map(x => pinOne(x[0], x[1])).join('') + '</div>';
}
function pinPanel(s){
  const tutti = pinsOf(s);
  const l = tutti.map((p, i) => [p, i]).filter(x => pinVis(x[0]));
  const altri = tutti.length - l.length;
  return (S.pen ? '<div class="note red">Matita accesa: clicca un punto del wireframe per segnarlo.</div>' : '') +
    '<div class="pinvis">Segni della vista <b>' + (S.mob ? 'mobile' : 'desktop') + '</b>' +
      (altri ? ' \u00b7 ne hai ' + altri + ' su ' + (S.mob ? 'desktop' : 'mobile') +
        ': <button data-xdo="m:mob">passa a ' + (S.mob ? 'desktop' : 'mobile') + '</button>' : '') + '</div>' +
    (l.length
      ? '<ol class="pinlist">' + l.map(x => {
          const p = x[0], i = x[1];
          return '<li' + (S.pinSel === i ? ' class="on"' : '') + '><span class="pin" data-pin="' + i + '">' + (i + 1) + '</span>' +
          '<span contenteditable="true" data-pinf="' + i + '" data-ph="cosa non va qui">' + (p.t || '') + '</span>' +
          '<button data-uxdo="pindel" data-uxi="' + i + '" title="Togli il segno">\u00d7</button></li>';
        }).join('') + '</ol>' +
        '<div class="uxbar"><button class="btn sm" data-uxdo="copy">Copia per lo spec \u29c9</button>' +
          '<button class="btn sm" data-uxdo="pinclear">Cancella tutti</button></div>'
      : '<div class="empty">Nessun segno su questa schermata in vista ' + (S.mob ? 'mobile' : 'desktop') + '.' + (S.pen ? '' : ' Accendi <b>matita rossa</b> nella barra in alto.') + '</div>');
}

/* il segno si sposta trascinandolo: niente render mentre trascini, solo alla fine */
document.addEventListener('mousedown', e => {
  const p = e.target.closest('.pinl .pin');
  if(!p) return;
  const layer = p.parentElement, box = layer.parentElement, i = +p.dataset.pin;
  const r = box.getBoundingClientRect();
  let mosso = false;
  const mv = ev => {
    mosso = true;
    const x = Math.max(0, Math.min(100, ((ev.clientX - r.left) / r.width) * 100));
    const y = Math.max(0, Math.min(100, ((ev.clientY - r.top) / r.height) * 100));
    p.style.left = x + '%'; p.style.top = y + '%';
    p.dataset.nx = x.toFixed(2); p.dataset.ny = y.toFixed(2);
  };
  const up = () => {
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    if(!mosso) return;
    snap('sposta segno');
    const l = pinsOf(scr(S.screen))[i];
    if(l){ l.x = +p.dataset.nx; l.y = +p.dataset.ny; }
    setTimeout(render, 0);
  };
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  e.preventDefault();
});

/* ── ARCHITETTURA ────────────────────────────────────
   Il progetto visto da fuori: dove si puo' andare, chi vede cosa, come si arriva
   in fondo. I collegamenti non sono disegnati a mano: si leggono dai pulsanti
   A({act:'go'}) che le view rendono davvero, quindi la mappa non puo' mentire su
   una navigazione che nel wireframe non c'e'. */
/* l'accesso detto corto: nel nodo 'nessun accesso' non ci sta, e troncato non dice niente */
const ARCLVL = {none:'chiuso', read:'lettura', write:'usa', full:'gestisce'};
const ARCH = {w:206, h:54, gx:66, gy:14, p:20};   /* misure del diagramma, in px */

/* tutti gli archi: per ogni schermata, dove portano i suoi pulsanti, per ogni
   ruolo che ci puo' entrare. Costa un render per ruolo per schermata, quindi si
   calcola una volta e si tiene. */
function archLinks(){
  if(S.archC) return S.archC;
  const r0 = S.role, s0 = S.screen, out = {};
  SCREENS.forEach(x => { out[x.id] = []; });
  SCREENS.forEach(x => {
    ROLES.forEach(r => {
      S.role = r.id; S.screen = x.id;
      if(lvl(x) === 'none') return;
      let html = '';
      try{ html = x.view(); }catch(e){ return; }
      const re = /data-do="go"\s+data-arg="([^"]*)"/g;
      let m;
      while((m = re.exec(html))){
        const t = m[1];
        if(t && t !== x.id && scr(t) && out[x.id].indexOf(t) < 0) out[x.id].push(t);
      }
    });
  });
  S.role = r0; S.screen = s0;
  return (S.archC = out);
}

/* i livelli: quanto lontano sta ogni schermata dalla prima, seguendo i pulsanti.
   Quello che nessun pulsante raggiunge finisce in fondo, dichiarato: e' un buco
   di progetto, non un dettaglio di disegno. */
function archLevels(links){
  const seen = {[SCREENS[0].id]:0}, cols = [[SCREENS[0].id]];
  let cur = [SCREENS[0].id], d = 0;
  while(cur.length){
    const next = [];
    cur.forEach(id => (links[id] || []).forEach(t => {
      if(seen[t] === undefined){ seen[t] = d + 1; next.push(t); }
    }));
    if(next.length) cols.push(next);
    cur = next; d++;
  }
  const orfane = SCREENS.filter(x => seen[x.id] === undefined).map(x => x.id);
  if(orfane.length) cols.push(orfane);
  /* nessuna colonna piu' alta di otto: un livello affollato si impagina su piu'
     colonne invece di diventare un nastro verticale che non si guarda. */
  const spez = [];
  cols.forEach(c => { for(let i = 0; i < c.length; i += 8) spez.push(c.slice(i, i + 8)); });
  return {cols:spez, orfane:orfane};
}

/* quanto e' larga la mappa: serve al foglio, che su una tela non ha una misura sua */
function archW(){
  const L = archLevels(archLinks());
  return ARCH.p * 2 + L.cols.length * (ARCH.w + ARCH.gx) - ARCH.gx;
}
function archMap(){
  const links = archLinks(), L = archLevels(links), A = ARCH;
  const pos = {};
  L.cols.forEach((col, c) => col.forEach((id, i) => {
    pos[id] = {x:A.p + c * (A.w + A.gx), y:A.p + i * (A.h + A.gy)};
  }));
  const righe = Math.max.apply(null, L.cols.map(c => c.length));
  const W = A.p * 2 + L.cols.length * (A.w + A.gx) - A.gx;
  const H = A.p * 2 + righe * (A.h + A.gy) - A.gy;

  let linee = '';
  Object.keys(links).forEach(a => links[a].forEach(b => {
    const p1 = pos[a], p2 = pos[b];
    if(!p1 || !p2) return;
    const x1 = p1.x + A.w, y1 = p1.y + A.h / 2, x2 = p2.x, y2 = p2.y + A.h / 2;
    const dx = Math.max(34, Math.abs(x2 - x1) / 2);
    linee += '<path d="M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ',' + (x2 - dx) + ' ' + y2 + ',' + x2 + ' ' + y2 + '" marker-end="url(#af)"/>';
  }));

  const nodi = SCREENS.filter(x => pos[x.id]).map(x => {
    const p = pos[x.id], l = lvl(x), g = GROUPS.find(y => y.id === x.g);
    return '<a class="nd' + (l === 'none' ? ' off' : '') + (x.id === S.screen ? ' on' : '') + '" data-screen="' + x.id + '"' +
      ' style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + A.w + 'px;height:' + A.h + 'px"' +
      ' title="' + esc(x.title || x.label) + '">' +
      '<b>' + x.label + '</b><small>' + ((g && g.name) || x.g) + ' · ' + ARCLVL[l] + '</small></a>';
  }).join('');

  return '<div class="archscr"><div class="archmap" style="width:' + W + 'px;height:' + H + 'px">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
      '<defs><marker id="af" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">' +
        '<path d="M0 0.8L7 4L0 7.2z"/></marker></defs>' + linee + '</svg>' + nodi + '</div></div>' +
    (L.orfane.length
      ? note('<b>' + L.orfane.length + ' schermate non le raggiunge nessun pulsante:</b> ' +
             L.orfane.map(id => scr(id).label).join(', ') +
             '. Ci si arriva solo dal menu o dall’indice: se devono stare in un percorso, manca un A({act:\'go\'}).')
      : note('Ogni schermata è raggiungibile da un pulsante. Le frecce sono i collegamenti che le view rendono davvero.'));
}

/* chi vede cosa: la matrice che di solito si spiega a voce */
function archRoles(){
  return tbl({cols:['Schermata', 'Gruppo'].concat(ROLES.map(r => r.name)),
    n:SCREENS.length + ' schermate × ' + ROLES.length + ' ruoli',
    rows:SCREENS.map(x => {
      const g = GROUPS.find(y => y.id === x.g);
      return [x.label, ((g && g.name) || x.g)].concat(ROLES.map(r => {
        const l = (x.acc && x.acc[r.id]) || 'none';
        return tag(LVL[l].toLowerCase(), l === 'none' ? 'ko' : l === 'full' ? 'b' : l === 'read' ? 'x' : 'k');
      }));
    })});
}

/* i flussi, uno per riga: i passi in catena, e sotto ogni passo le deviazioni */
function archFlows(){
  const fs = flows();
  if(!fs.length) return empty('Questo progetto non dichiara FLOWS: non c’è nessun percorso da diagrammare.');
  return fs.map(f => {
    const passi = f.steps.map((st, i) => {
      const sc = scr(st.screen), r = st.role || f.role;
      const rn = r && ROLES.find(x => x.id === r);
      return '<div class="pc">' +
        '<div class="st"><span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<b>' + ((sc && sc.label) || st.screen) + '</b>' +
          '<small>' + esc(st.act || '') + '</small>' +
          (rn ? '<span class="who">' + rn.name + '</span>' : '') +
          (st.end ? '<span class="end">' + esc(st.end) + '</span>' : '') + '</div>' +
        (st.err || []).map(e =>
          '<div class="er"><b>' + esc(e.name) + '</b><small>' + esc(e.fix) + '</small></div>').join('') +
      '</div>' + (i < f.steps.length - 1 ? '<div class="ar">→</div>' : '');
    }).join('');
    const rn = f.role && ROLES.find(x => x.id === f.role);
    return sec(f.name, '<div class="archfl">' + passi + '</div>',
      (rn ? rn.name + ' · ' : '') + f.steps.length + ' passi · ' +
      f.steps.reduce((n, x) => n + (x.err || []).length, 0) + ' deviazioni');
  }).join('');
}

/* ── LA TELA ──
   L'architettura non sta dentro una pagina: sta su una tela senza bordi, che si
   trascina e si avvicina. Il mondo e' un solo elemento con una transform, quindi
   spostarsi e ingrandire non ridisegnano niente. Quello che ci si annota sopra ha
   coordinate in px del mondo: resta dove l'hai messo a qualunque ingrandimento. */
const ARCZ = {min:.25, max:2.4};
const arcT = () => 'translate(' + S.arc.x + 'px,' + S.arc.y + 'px) scale(' + S.arc.z + ')';
function arcApply(){
  const w = $('.aworld'); if(w) w.style.transform = arcT();
  const z = $('.azoom'); if(z) z.textContent = Math.round(S.arc.z * 100) + '%';
}
/* dal puntatore alle coordinate del mondo: l'unica conversione di tutta la tela */
function arcXY(ev){
  const w = $('.aworld');
  if(!w || !w.getBoundingClientRect) return {x:0, y:0};
  const r = w.getBoundingClientRect();
  return {x:Math.round((ev.clientX - r.left) / S.arc.z), y:Math.round((ev.clientY - r.top) / S.arc.z)};
}
function arcZoom(z, cx, cy){
  const cv = $('.archcv');
  if(!cv || !cv.getBoundingClientRect) return;
  const nz = Math.min(ARCZ.max, Math.max(ARCZ.min, z)), r = cv.getBoundingClientRect();
  const px = cx === undefined ? r.width / 2 : cx - r.left;
  const py = cy === undefined ? r.height / 2 : cy - r.top;
  /* il punto sotto il cursore resta sotto il cursore */
  S.arc.x = px - (px - S.arc.x) * (nz / S.arc.z);
  S.arc.y = py - (py - S.arc.y) * (nz / S.arc.z);
  S.arc.z = nz;
  arcApply();
}
function arcFit(){
  const w = $('.aworld'), cv = $('.archcv');
  if(!w || !cv || !cv.getBoundingClientRect) return;
  const r = cv.getBoundingClientRect();
  const z = Math.min(1, Math.max(ARCZ.min, Math.min((r.width - 48) / (w.offsetWidth || 1), (r.height - 48) / (w.offsetHeight || 1))));
  S.arc.z = z;
  S.arc.x = Math.max(24, (r.width - w.offsetWidth * z) / 2);
  S.arc.y = 24;
  arcApply();
}

/* sposta un tratto: le coordinate stanno dentro la d, quindi si riscrivono. Il
   formato lo produciamo noi ('M12 40L13 41'), non e' un parser di SVG generico. */
const arcMove = (d, dx, dy) =>
  d.replace(/([ML])(-?[\d.]+) (-?[\d.]+)/g, (m, c, x, y) => c + (+x + dx) + ' ' + (+y + dy));

/* toglie quello che e' scelto, tratto o appunto che sia */
function arcDel(){
  if(!S.asel) return;
  snap(S.asel.k === 'ink' ? 'togli tratto' : 'togli appunto');
  (S.asel.k === 'ink' ? S.arc.ink : S.arc.txt).splice(S.asel.i, 1);
  S.asel = null;
  render();
}

function archView(){
  const links = archLinks();
  const n = Object.keys(links).reduce((a, k) => a + links[k].length, 0);
  const corpo = '<div class="page wide arch">' +
    '<div class="content">' +
      sec('Mappa della navigazione', archMap(),
          SCREENS.length + ' schermate · ' + n + ' collegamenti · clicca un nodo per aprirlo') +
      sec('Chi vede cosa', archRoles(), 'la matrice degli accessi, come sta in SCREENS.acc') +
      archFlows() +
    '</div></div>';
  /* il foglio non ha una larghezza di suo: la prende dal diagramma, o niente ci sta
     dentro e i nodi finiscono a sbordare sulla tela */
  const W = Math.max(1000, archW() + 50);
  return '<div class="archcv" data-atool="' + S.atool + '">' +
    '<div class="aworld" style="transform:' + arcT() + ';width:' + W + 'px">' + corpo +
      '<svg class="aink">' + S.arc.ink.map((d, i) =>
        '<g data-ai="' + i + '" class="' + (S.asel && S.asel.k === 'ink' && S.asel.i === i ? 'on' : '') + '">' +
          '<path class="hit" d="' + d + '"/>' +
          '<path d="' + d + '" vector-effect="non-scaling-stroke"/></g>').join('') + '</svg>' +
      S.arc.txt.map((t, i) =>
        '<div class="anote' + (S.asel && S.asel.k === 'txt' && S.asel.i === i ? ' on' : '') + '" data-anote="' + i + '"' +
          ' style="left:' + t.x + 'px;top:' + t.y + 'px">' +
          '<span contenteditable spellcheck="false">' + esc(t.t || '') + '</span>' +
          '<button data-xdo="adel:' + i + '" title="Togli l\u2019appunto">\u00d7</button></div>').join('') +
    '</div></div>';
}

/* ── ESPORTA ─────────────────────────────────────────
   Ricostruisce il file dalle sue parti (lo <style> e gli <script> vivono nel DOM)
   e ci cuce dentro il punto in cui sei: chi lo apre parte da questa schermata.
   ponytail: nessuna libreria, Blob e <a download> bastano. */
/* render() sovrascrive document.body, e il browser ha spostato il <script> dentro
   il body: dopo il primo render il tag non esiste piu'. Il sorgente si copia
   all'avvio, finche' c'e'. */
const SRC = {css:'', js:''};
function grabSource(){
  SRC.css = (document.querySelector('style') || {textContent:''}).textContent || '';
  SRC.js  = (document.currentScript || document.querySelector('script') || {textContent:''}).textContent || '';
}

function slug(t){ return String(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

function exportHtml(){
  if(typeof Blob === 'undefined'){ toast('Esportazione non disponibile qui.', true); return; }
  const css = SRC.css, js = SRC.js;
  if(!js){ toast('Esportazione non riuscita: sorgente non disponibile.', true); return; }
  const state = JSON.stringify({role:S.role, screen:S.screen, flow:S.flow, mob:S.mob, ux:S.ux, uxSel:S.uxSel, uxEd:S.uxEd, pen:false, pins:S.pins, txt:false, txtEd:S.txtEd, inks:S.inks, seeded:true});
  const seeded = js.replace(/(Object\.assign\(S, \{[^\n]*\}\);\n)?start\(\);\s*$/, 'Object.assign(S, ' + state + ');\nstart();\n');
  if(seeded === js){ toast('Esportazione non riuscita: file non riconosciuto.', true); return; }

  const html = '<!DOCTYPE html>\n<html lang="it">\n<head>\n' +
    '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<title>' + document.title + '</title>\n<style>\n' + css + '\n</style>\n</head>\n' +
    '<body></body>\n<script>\n' + seeded + '\n</' + 'script>\n</html>\n';

  const name = slug(BRAND.name) + '-' + slug(scr(S.screen).label) + '.html';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  log('Esportato ' + name);
  toast(name + ' \u2014 file unico, si apre offline e parte da questa schermata.');
}

/* chi guarda: il menu di sistema non si puo' disegnare, quindi non lo usiamo */
function rolePick(r){
  return '<div class="pick' + (S.rmenu ? ' open' : '') + '">' +
    '<button class="cur" data-xdo="rmenu" aria-expanded="' + !!S.rmenu + '" title="Cambia il ruolo con cui stai guardando">' +
      '<i style="background:' + r.color + '"></i><span>' + r.name + '</span>' + ico('chev') + '</button>' +
    '<div class="menu">' + ROLES.map(x => {
      const n = SCREENS.filter(y => lvl(y, x.id) !== 'none').length;
      return '<button data-role="' + x.id + '"' + (x.id === S.role ? ' class="on"' : '') + '>' +
        '<i style="background:' + x.color + '"></i>' +
        '<span class="g"><b>' + x.name + '</b><small>' + x.access + ' \u00b7 ' + n + '/' + SCREENS.length + ' schermate</small></span>' +
        (x.id === S.role ? ico('check') : '') + '</button>';
    }).join('') + '</div></div>';
}

/* ── ANNULLA ─────────────────────────────────────────
   Una pila di fotografie del lavoro (sezioni, segni, testi). Tutto quello che
   modifica passa da snap(): cosi' una sezione cancellata per sbaglio torna. */
const HIST = [], REDO = [];
const stato = () => JSON.stringify({u:S.uxEd, p:S.pins, t:S.txtEd, i:S.inks});
function metti(j){
  const o = JSON.parse(j);
  S.uxEd = o.u; S.pins = o.p; S.txtEd = o.t; S.inks = o.i || {};
  S.uxSel = S.pinSel = S.pinLast = null;
}
function snap(what){
  HIST.push({j:stato(), w:what || 'modifica', t:Date.now()});
  if(HIST.length > 60) HIST.shift();
  REDO.length = 0;                     /* una strada nuova cancella quella avanti */
}
function undo(){
  if(!HIST.length){ toast('Niente da annullare.', true); return; }
  const h = HIST.pop();
  REDO.push({j:stato(), w:h.w, t:Date.now()});
  metti(h.j);
  toast('Annullato: ' + h.w + '.');
}
function redo(){
  if(!REDO.length){ toast('Niente da rifare.', true); return; }
  const r = REDO.pop();
  HIST.push({j:stato(), w:r.w, t:Date.now()});
  metti(r.j);
  toast('Rifatto: ' + r.w + '.');
}
/* macchina del tempo: torna a uno qualsiasi dei passi indietro, senza perdere gli altri */
function timeGo(i){
  if(i < 0 || i >= HIST.length) return;
  while(HIST.length > i){
    const h = HIST.pop();
    REDO.push({j:stato(), w:h.w, t:Date.now()});
    metti(h.j);
  }
  toast('Tornato indietro di ' + REDO.length + ' passi.');
}
function timePanel(){
  if(!HIST.length && !REDO.length) return '<div class="empty">Ogni modifica lascia un passo qui: da qui si torna indietro e si riparte.</div>';
  const riga = (x, i, avanti) =>
    '<li' + (avanti ? ' class="av"' : '') + '><button data-uxdo="' + (avanti ? 'redo' : 'time:' + i) + '">' +
      '<b>' + x.w + '</b><small>' + stOra(x.t) + '</small></button></li>';
  return '<ol class="time">' +
    REDO.map((x, i) => riga(x, i, true)).reverse().join('') +
    '<li class="ora"><span>adesso</span></li>' +
    HIST.slice().reverse().map((x, i) => riga(x, HIST.length - 1 - i, false)).join('') +
  '</ol>';
}

/* ── SALVATAGGIO ─────────────────────────────────────
   Il lavoro (sezioni, segni, testi) resta in questo browser, per progetto. Non e'
   un archivio: e' il non perdere quello che hai fatto se ricarichi o chiudi.
   Le due uscite vere restano l'HTML unico (Condividi) e lo spec (scarica spec). */
const stKey = () => 'wf:' + slug(BRAND.name || 'wireframe');
/* le sezioni dedotte e mai toccate non sono lavoro: non si salvano e non finiscono
   nello spec, se no ogni schermata che guardi lascerebbe traccia */
const uxDiff = s => JSON.stringify(uxDumpList(s)) !== JSON.stringify(uxDumpList(s, true));
function uxVero(){
  const o = {}, prima = S.screen;
  Object.keys(S.uxEd).forEach(k => {
    const s = scr(k); if(!s) return;
    S.screen = k;                       /* uxBase guarda la schermata corrente */
    if(uxDiff(s)) o[k] = S.uxEd[k];
  });
  S.screen = prima;
  return o;
}
const stHas = () => Object.keys(uxVero()).length || Object.keys(S.pins).length || Object.keys(S.txtEd).length || Object.keys(S.inks).length;
function stSave(){
  if(S.seeded || typeof localStorage === 'undefined') return;
  try{
    if(!stHas() && !S.saved) return;
    localStorage.setItem(stKey(), JSON.stringify({v:1, t:Date.now(), uxEd:uxVero(), pins:S.pins, txtEd:S.txtEd, inks:S.inks, arc:S.arc}));
    S.saved = Date.now();
  }catch(e){ S.saved = 'ko'; }
}
function stLoad(){
  if(typeof localStorage === 'undefined') return null;
  try{
    const r = JSON.parse(localStorage.getItem(stKey()) || 'null');
    if(!r) return null;
    S.uxEd = r.uxEd || {}; S.pins = r.pins || {}; S.txtEd = r.txtEd || {}; S.inks = r.inks || {};
    if(r.arc) S.arc = r.arc;
    S.saved = r.t;
    return r;
  }catch(e){ return null; }
}
function stClear(){
  try{ if(typeof localStorage !== 'undefined') localStorage.removeItem(stKey()); }catch(e){}
  S.uxEd = {}; S.pins = {}; S.txtEd = {}; S.inks = {}; S.arc = {ink:[], txt:[], x:0, y:0, z:1}; S.saved = null;
  S.uxSel = S.pinSel = null;
  toast('Modifiche scartate: il wireframe e\u2019 tornato com\u2019\u00e8 nello spec.');
}
const stOra = t => typeof t === 'number' ? new Date(t).toTimeString().slice(0, 5) : '';
function stPanel(){
  const n = Object.keys(uxVero()).length, p = Object.keys(S.pins).length, t = Object.keys(S.txtEd).length;
  if(S.seeded) return '<div class="note">Questo \u00e8 un file gi\u00e0 condiviso: si riapre sempre come \u00e8 stato mandato. Le modifiche che fai qui non vengono salvate \u2014 per tenerle, esportalo di nuovo con <b>condividi</b>.</div>';
  if(S.saved === 'ko') return '<div class="note red">Questo browser non lascia salvare (finestra privata?). Le modifiche vivono finch\u00e9 non ricarichi: esportale prima.</div>';
  if(!S.saved) return '<div class="empty">Appena modifichi qualcosa, il lavoro viene salvato in questo browser.</div>';
  return '<div class="stbar"><span>Salvato alle <b>' + stOra(S.saved) + '</b> \u00b7 ' + n + ' schermate, ' + p + ' con segni, ' + t + ' con testi cambiati</span>' +
    '<button class="btn sm" data-uxdo="stclear" title="Torna al wireframe come sta nello spec">Scarta le modifiche</button></div>';
}

/* ── DOCK ────────────────────────────────────────────
   Tutti i modi in una barra sola, in basso: il wireframe resta la cosa piu' grande
   sullo schermo e gli interruttori stanno dove sta la mano. */
const ICO = {
  note:'<path d="M4 14V2.5h8.5L11 6l1.5 3.5H4"/>',
  sez:'<rect x="2.2" y="2.2" width="11.6" height="11.6" rx="1"/><path d="M2.2 6.4h11.6M2.2 10.2h11.6"/>',
  segno:'<circle cx="8" cy="8" r="3" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="6"/>',

const ico = k => '<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICO[k] + '</svg>';

function dockBtn(k, label, title, on, cls, i){
  return '<button class="' + (cls || '') + (on ? ' on' : '') + '" data-xdo="m:' + k + '" aria-pressed="' + !!on + '" title="' + esc(title) + '">' +
    (i ? ico(i) : '') + '<span>' + label + '</span></button>';
}
/* 'modifica' accende insieme sezioni e testi: giudicare una sezione e riscriverne
   il titolo sono lo stesso gesto, e tenerli separati costringeva a cambiare modo. */
function setMode(k){
  if(k === 'edit'){ const on = !(S.ux && S.txt); S.ux = S.txt = on; S.uxSel = null; S.pal = false; }
  if(k === 'ann')  S.ann = !S.ann;
  if(k === 'pen'){  S.pen = !S.pen; if(S.pen) S.draw = false; }
  if(k === 'draw'){ S.draw = !S.draw; if(S.draw) S.pen = false; }
  if(k === 'hide') S.hideOff = !S.hideOff;
  if(k === 'solo') S.solo = !S.solo;
  if(k === 'mob')  S.mob = !S.mob;
  /* l'architettura non e' una schermata: e' il progetto visto da fuori. Spegne gli
     strumenti che lavorano sul wireframe, perche' su un diagramma non hanno senso. */
  if(k === 'arch'){ S.arch = !S.arch; if(S.arch){ S.ux = S.txt = S.pen = S.draw = false; S.uxSel = S.pinSel = null; } }
  if(k !== 'ann' && k !== 'hide') S.opts = false;
}
/* Sulla tela gli strumenti sono due, e basta: un tratto e un appunto. Tutti e due
   rossi, perche' quello che si aggiunge a mano non e' il progetto, e' quello che
   hai da dire sul progetto. */
function archDock(){
  const t = k => S.atool === k ? ' on' : '';
  return '<div class="dock arch">' +
    '<span class="g">' +
      '<button class="' + t('pan') + '" data-xdo="at:pan" title="Sposta la tela: trascina, o scorri con due dita">' + ico('mano') + '<span>sposta</span></button>' +
      '<button class="' + t('sel') + '" data-xdo="at:sel" title="Scegli un tratto o un appunto: trascina per spostarlo, Canc per toglierlo">' + ico('cursore') + '<span>seleziona</span></button>' +
      '<button class="pen' + t('pen') + '" data-xdo="at:pen" title="Matita rossa: traccia sulla tela">' + ico('penna') + '<span>matita</span></button>' +
      '<button class="pen' + t('txt') + '" data-xdo="at:txt" title="Appunto rosso: clicca dove vuoi scriverlo">' + ico('testi') + '<span>appunto</span></button>' +
      (S.asel
        ? '<button class="pen on" data-xdo="adelsel" title="Togli quello che hai scelto (Canc)">' + ico('chiudi') + '<span>togli</span></button>'
        : S.arc.ink.length || S.arc.txt.length
        ? '<button data-xdo="aclear" title="Via tratti e appunti da questa tela">' + ico('chiudi') + '<span>pulisci</span></button>' : '') +
    '</span><span class="sp"></span>' +
    '<span class="g">' +
      '<button data-xdo="az:out" title="Allontana">\u2212</button>' +
      '<span class="azoom">' + Math.round(S.arc.z * 100) + '%</span>' +

    '</span><span class="sp"></span>' +

      ? '<span class="who"><span class="lab">come</span>' + rolePick(role()) + '</span><span class="sp"></span>'
