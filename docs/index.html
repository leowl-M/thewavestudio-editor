<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor wireframe</title>
<style>
/* KAI — wireframe ad alta fedeltà, navigabile per ruolo.
   Greyscale: struttura, gerarchia e componenti reali, nessun colore di brand. */
:root{
  /* Inchiostro: tre livelli per il testo, tutti leggibili (4.5:1 su carta), piu' uno
     decorativo. --ink-4 non regge una parola: e' per i segnaposto e i tratteggi. */
  --ink:#16181a; --ink-2:#4a4f54; --ink-3:#666c73; --ink-4:#9aa0a5;
  --line:#d9d9d6; --line-2:#b9b9b5; --line-3:#8d8d89;
  --paper:#fff; --fill:#f5f5f3; --fill-2:#ebebe8; --fill-3:#e0e0dc;
  --canvas:#d6d6d2;
  --role:#16181a;
  /* Spazio fra i blocchi. Dentro un blocco --s3, fra blocchi --s4, fra fasce --s6:
     mai la stessa misura a due livelli diversi, o la gerarchia sparisce. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  /* Spazio dentro un controllo: pill, tag, badge. E' l'altra densita', e va detta. */
  --i1:2px; --i2:4px; --i3:6px; --i4:10px;
  /* Altezze dei controlli. Sotto i 36px un controllo legge come schiacciato. */
  --ctl:38px; --ctl-sm:30px; --ctl-lg:46px;
  /* Sette gradini, e nessuna misura scritta a mano. Sotto --t7 non esiste testo. */
  --t1:31px; --t2:22px; --t3:17px; --t4:15px; --t5:13px; --t6:11.5px; --t7:10px;
  /* Elevazione: quanto una cosa sta sopra alle altre. */
  --z1:0 1px 2px rgba(22,24,26,.06);
  --z2:0 2px 8px rgba(22,24,26,.10);
  --z3:0 8px 28px rgba(22,24,26,.14);
  --z4:0 18px 48px rgba(22,24,26,.20);
  /* Il fuoco in scala di grigi e' un doppio anello: chiaro e poi scuro, cosi' si
     vede anche su un bottone nero, dove un outline solo sparirebbe. */
  --ring:0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
  /* Tempo. Entrare e' piu' lento di uscire: aprire dev'essere deciso, chiudere
     immediato. Niente si sposta piu' di 8px: il grosso lo fa l'opacita'. */
  --d1:120ms; --d2:200ms; --d3:280ms;
  --e-in:cubic-bezier(.2,0,0,1); --e-out:cubic-bezier(.4,0,1,1);
  /* Quota libera sopra la barra degli strumenti: 18px da terra + 44px di barra +
     12px d'aria. Ci si appoggia sopra tutto quello che flotta in basso, cosi' un
     avviso non copre mai i comandi. */
  --dock:76px;
  --rail:300px; --side:300px; --sim:86px; --top:40px;
  --ok:#2f6b4f; --ko:#a8332f;   /* semantici, non di brand: solo per i flussi */
}
/* Chi ha chiesto meno movimento lo ottiene: gli stati restano, l'animazione no. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-weight:600;letter-spacing:-.015em;line-height:1.25}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.01em}
.mut{color:var(--ink-3)}

/* ══ BARRA DEL SIMULATORE ══ */
.sim{z-index:80;background:var(--fill-2);border-bottom:1px solid var(--line-2);overflow:visible}
.canvas>.cv{padding:var(--s5) var(--s5) 104px}
.sim .b1{display:flex;align-items:center;gap:10px;padding:0 12px;height:var(--top);border-bottom:1px solid var(--line)}
.sim .dots{display:flex;gap:5px}
.sim .dots i{width:9px;height:9px;border:1px solid var(--line-3);border-radius:50%}
.sim .url{flex:1;background:var(--paper);border:1px solid var(--line-2);border-radius:13px;padding:3px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim .b2{display:flex;align-items:baseline;gap:10px;padding:7px 12px;flex-wrap:wrap}
.sim .b2 .mut{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sim .lab{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.sim select{background:var(--paper);border:1px solid var(--line-2);padding:5px 8px;font-size:12.5px;border-radius:2px}
.sim .acc{font-size:11.5px;color:var(--ink-3);border-left:1px solid var(--line);padding-left:10px}
.sim .tog{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.sim .tog label{display:flex;gap:5px;align-items:center;cursor:pointer}

/* ══ IMPALCATURA ══ */
.layout{display:flex;align-items:flex-start}
.rail{width:var(--rail);flex:none;background:var(--paper);border-right:1px solid var(--line-2);padding-bottom:var(--s5)}
.rail>.hd,aside.side>.hd{height:var(--top);flex:none;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s3);border-bottom:1px solid var(--line-2);background:var(--fill-2);position:sticky;top:0;z-index:5}
.rail>.hd b{font-size:13px;letter-spacing:-.01em}
.rail>.hd .mono{margin-left:auto}
aside.side>.hd{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.rail .grp{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-4);padding:var(--s3) var(--s3);border-left:none;border-top:1px solid var(--line)}
.rail .grp::before{content:"\25B8";margin-right:2px}
.rail .grp.open::before{content:"\25BE"}
.rail .grp.open{color:var(--ink-2)}
.rail .grp .n{margin-left:auto;font-size:9.5px;color:var(--ink-4)}
.rail a{display:flex;gap:var(--s2);align-items:center;padding:6px var(--s3);font-size:12.5px;text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.rail a:hover{background:var(--fill)}
.rail a[aria-current="true"]{background:var(--fill-2);border-left-color:var(--role);font-weight:600}
.rail a .t{margin-left:auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-4);border:1px solid var(--line);padding:1px 4px;border-radius:2px}
.rail a.off{color:var(--ink-4)}
.rail a.off .t{border-style:dashed}

.canvas{flex:1;min-width:0;background:var(--canvas);padding:0}
.page{background:var(--paper);border:1px solid var(--line-2);max-width:1180px;margin:0 auto;box-shadow:0 1px 0 rgba(0,0,0,.04);container-type:inline-size}
.page.wide{max-width:1320px}

aside.side{width:var(--side);flex:none;background:var(--paper);border-left:1px solid var(--line-2)}
aside.side h4{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-4);margin:var(--s4) 0 var(--s2)}
aside.side h4:first-child{margin-top:0}

/* ══ CHROME SITO PUBBLICO ══ */
.sh{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s5);padding:0 var(--s5);height:62px}
.sh .logo{display:flex;align-items:center;gap:var(--s2);font-weight:600;letter-spacing:-.02em;font-size:var(--t3)}
.sh .logo i{width:26px;height:26px;background:var(--ink);display:block}
.sh nav{display:flex;gap:var(--s4);margin-left:var(--s5);flex:1;overflow-x:auto}
.sh nav a{font-size:var(--t5);color:var(--ink-2);text-decoration:none;padding:var(--i2) 0;border-bottom:2px solid transparent;
  white-space:nowrap;cursor:pointer;transition:color var(--d1) ease,border-color var(--d1) ease}
.sh nav a:hover{color:var(--ink);border-bottom-color:var(--line-2)}
.sh nav a:focus-visible{outline:none;box-shadow:var(--ring);border-radius:2px}
.sh nav a[aria-current="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.sh .cta{display:flex;gap:var(--s2);flex:none}
.subnav{border-bottom:1px solid var(--line);background:var(--fill);padding:0 var(--s5);display:flex;gap:var(--s5);overflow-x:auto}
.subnav a{font-size:var(--t6);color:var(--ink-3);padding:var(--i4) 0;text-decoration:none;white-space:nowrap;cursor:pointer;
  border-bottom:2px solid transparent;transition:color var(--d1) ease,border-color var(--d1) ease}
.subnav a:hover{color:var(--ink-2);border-bottom-color:var(--line-2)}
.subnav a[aria-current="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--line-3)}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--s6);padding:var(--s7) var(--s5);border-bottom:1px solid var(--line);align-items:center}
.hero .kick{font-size:var(--t7);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:var(--s3)}
.hero h1{font-size:var(--t1);margin-bottom:var(--s3);max-width:17ch}
.hero p{font-size:var(--t4);line-height:1.5;color:var(--ink-2);max-width:46ch;margin-bottom:var(--s4)}
.hero .trust{display:flex;gap:var(--s4);margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);flex-wrap:wrap}
.hero .trust div{font-size:var(--t6);color:var(--ink-3);max-width:20ch}
.hero .trust b{display:block;font-size:var(--t3);color:var(--ink);font-weight:600}

.band{padding:var(--s6) var(--s5);border-bottom:1px solid var(--line)}
.band.alt{background:var(--fill)}
.band>header{margin-bottom:var(--s4);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.band>header .kick{font-size:var(--t7);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.band>header h2{font-size:var(--t2);margin-top:var(--s1)}
.band>header p{font-size:var(--t5);line-height:1.5;color:var(--ink-3);max-width:68ch;margin-top:var(--s2)}
.band.cta{display:flex;align-items:center;justify-content:space-between;gap:var(--s5);flex-wrap:wrap;background:var(--fill-2)}
.band.cta h2{font-size:var(--t2);max-width:26ch}
.band.cta p{font-size:var(--t5);line-height:1.5;color:var(--ink-2);max-width:50ch;margin-top:var(--s2)}

.sf{background:var(--fill-2);border-top:1px solid var(--line-2);padding:var(--s6) var(--s5) var(--s5)}
.sf .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:var(--s5)}
.sf h5{font-size:var(--t7);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:var(--s3)}
.sf ul{list-style:none}
.sf li{font-size:var(--t5);color:var(--ink-2);margin-bottom:var(--i3)}
.sf .legal{margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;font-size:var(--t6);color:var(--ink-3)}

/* ══ CHROME APPLICAZIONE ══ */
.ah{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);height:54px;border-bottom:1px solid var(--line)}
.ah .logo{display:flex;align-items:center;gap:var(--s2);font-weight:600;font-size:var(--t4);letter-spacing:-.02em}
.ah .logo i{width:22px;height:22px;background:var(--ink);display:block}
.ah .sep{width:1px;height:22px;background:var(--line)}
.ah .ctx{font-size:var(--t6);color:var(--ink-3)}
.ah .search{flex:1;max-width:340px;min-height:var(--ctl-sm);display:flex;align-items:center;border:1px solid var(--line-2);
  background:var(--fill);padding:0 var(--i4);font-size:var(--t5);color:var(--ink-3);border-radius:2px;cursor:text;
  transition:border-color var(--d1) ease,background var(--d1) ease}
.ah .search:hover{border-color:var(--line-3);background:var(--paper)}
.ah .icons{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}
.ah .ic{position:relative;width:var(--ctl-sm);height:var(--ctl-sm);border:1px solid var(--line-2);display:flex;align-items:center;
  justify-content:center;font-size:var(--t6);color:var(--ink-2);border-radius:2px;cursor:pointer;
  transition:border-color var(--d1) ease,background var(--d1) ease}
.ah .ic:hover{border-color:var(--ink);background:var(--fill)}
.ah .ic b{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;font-size:var(--t7);line-height:14px;min-width:14px;text-align:center;border-radius:8px;padding:0 3px;font-weight:600}
.ah .me{display:flex;align-items:center;gap:var(--s2);font-size:var(--t6);color:var(--ink-2)}
.ah .me i{width:26px;height:26px;border-radius:50%;background:var(--fill-3);border:1px solid var(--line-2);display:block}

.appbody{display:flex;align-items:stretch;min-height:440px}
.appnav{width:196px;flex:none;border-right:1px solid var(--line);background:var(--fill);padding:var(--s3) 0}
.appnav .grp{font-size:var(--t7);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-4);padding:var(--s3) var(--s3) var(--s1)}
/* la voce di menu e' un controllo: ha l'altezza di un controllo */
.appnav a{display:flex;gap:var(--s2);align-items:center;min-height:var(--ctl-sm);padding:var(--i3) var(--s3);
  font-size:var(--t5);text-decoration:none;cursor:pointer;border-left:3px solid transparent;color:var(--ink-2);
  transition:background var(--d1) ease,color var(--d1) ease,border-color var(--d1) ease}
.appnav a:hover{background:var(--fill-2);color:var(--ink);border-left-color:var(--line-2)}
.appnav a:focus-visible{outline:none;box-shadow:var(--ring)}
.appnav a[aria-current="true"]{background:var(--paper);border-left-color:var(--role);color:var(--ink);font-weight:600}
.appnav a.off{color:var(--ink-4)}
.apptabs{display:flex;gap:var(--s3);overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 var(--s3)}
.apptabs a{font-size:var(--t6);color:var(--ink-3);padding:var(--i4) 0;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;text-decoration:none}
.apptabs a:hover{color:var(--ink)}
.apptabs a[aria-current="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--role)}
.apptabs a.off{color:var(--ink-4);text-decoration:line-through}
.appnav a.off::after{content:"chiuso";margin-left:auto;font-size:var(--t7);text-transform:uppercase;letter-spacing:.05em;border:1px dashed var(--line-2);padding:0 3px}
/* pallino sulla voce: quante cose aspettano li' dentro. Su una voce chiusa non esce. */
.appnav a .bg{margin-left:auto;font-size:var(--t7);font-weight:600;min-width:16px;height:16px;line-height:15px;text-align:center;
  border:1px solid var(--line-2);border-radius:9px;background:var(--paper);color:var(--ink-2);padding:0 4px}
.appnav a[aria-current="true"] .bg{border-color:var(--ink);background:var(--ink);color:#fff}
.appmain{flex:1;min-width:0}

.crumb{padding:var(--s3) var(--s5) 0;font-size:var(--t6);color:var(--ink-3);font-family:ui-monospace,Menlo,monospace}
.phead{padding:var(--s2) var(--s5) var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s5);flex-wrap:wrap}
.phead h1{font-size:var(--t2)}
.phead p{font-size:var(--t5);line-height:1.5;color:var(--ink-3);max-width:68ch;margin-top:var(--i3)}
.phead .pa{display:flex;gap:var(--s2);flex-wrap:wrap;flex:none}
.tabs{display:flex;gap:var(--s4);padding:0 var(--s5);border-bottom:1px solid var(--line);background:var(--fill);overflow-x:auto}
.tabs span{padding:var(--i4) 0;font-size:var(--t5);color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;
  cursor:pointer;transition:color var(--d1) ease,border-color var(--d1) ease}
.tabs span:hover{color:var(--ink-2);border-bottom-color:var(--line-2)}
.tabs span[aria-current="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.content{padding:var(--s5)}

/* ══ COMPONENTI ══ */
.sec{margin-bottom:var(--s5)}
.sec>h3{font-size:var(--t7);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:var(--s3);display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.sec>h3 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink-3);font-size:var(--t6)}
.row{display:grid;gap:var(--s3)}
/* Meglio due file arieggiate che quattro colonne strizzate: la misura minima e'
   alta apposta, cosi' la griglia si rompe prima di comprimere le schede. */
.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.c4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.split{display:grid;grid-template-columns:1fr 340px;gap:var(--s5);align-items:start}

/* LA SCHEDA — padding uguale su tutti i lati: l'asimmetria di prima faceva
   sembrare il contenuto incollato in alto. Si solleva solo se e' cliccabile:
   una scheda che si muove al passaggio sta promettendo che ci si puo' entrare. */
.box{background:var(--paper);border:1px solid var(--line);padding:var(--s4);
  transition:border-color var(--d1) ease,box-shadow var(--d1) ease}
.box.flat{border-color:var(--line);background:var(--fill)}
.box h4{font-size:var(--t4);line-height:1.3;margin-bottom:var(--i3)}
.box p{font-size:var(--t5);line-height:1.5;color:var(--ink-2);max-width:68ch}
.box .meta{font-size:var(--t6);color:var(--ink-3);margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--line)}
.box .thumb{margin:calc(-1 * var(--s4)) calc(-1 * var(--s4)) var(--s4);border-bottom:1px solid var(--line)}
.box .acts{margin-top:var(--s3)}
a.box:hover,.box.go:hover{border-color:var(--line-3);box-shadow:var(--z2)}

.ph{background:repeating-linear-gradient(45deg,var(--fill),var(--fill) 8px,var(--fill-2) 8px,var(--fill-2) 16px);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;font-size:var(--t7);min-height:96px;text-align:center;padding:var(--s2);position:relative}
.ph::before,.ph::after{content:"";position:absolute;inset:0;pointer-events:none}
.ph.x::before{background:linear-gradient(to top right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px))}
.ph.x::after{background:linear-gradient(to bottom right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px))}
.ph.tall{min-height:230px}
.ph.wide{min-height:170px}
/* carta millimetrata: griglia tecnica di fondo. Le linee marcate stanno sopra
   quelle sottili, come sulla carta vera. Si mette su una fascia: .band.mm, .hero.mm */
.mm{background-image:
  linear-gradient(var(--line-2) 1px,transparent 1px),
  linear-gradient(90deg,var(--line-2) 1px,transparent 1px),
  linear-gradient(var(--fill-3) 1px,transparent 1px),
  linear-gradient(90deg,var(--fill-3) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px}

/* griglia irregolare: sei colonne, la voce dichiara la sua misura inline (grid-column)
   perche' e' un numero che decide chi scrive la pagina, non un caso previsto qui. */
.grd{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s3);align-items:start}
.grd .gi{min-width:0;margin:0}
.grd .gi.off{margin-left:calc(-1 * var(--s5));margin-right:calc(-1 * var(--s5))}
.grd .gi figcaption{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t7);color:var(--ink-3);margin-top:6px}
.grd .gv{min-height:var(--s5)}

/* segno editoriale: annotazione a mano, storta di un grado. Non usa il rosso:
   quello resta della matita dell'editor. */
.mk{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t6);color:var(--ink-2);border:1px solid var(--line-3);border-radius:11px;padding:0 8px;transform:rotate(-1.2deg)}
.mk.n{border-radius:50%;padding:0;width:20px;height:20px;line-height:18px;text-align:center}
.mk.ar{border:none;border-radius:0;border-bottom:1px solid var(--line-3);padding:0 2px;transform:rotate(-.6deg)}

.lines i{display:block;height:8px;background:var(--fill-2);border:1px solid var(--line);margin-bottom:6px}
.lines i:nth-child(2){width:93%}.lines i:nth-child(3){width:80%}.lines i:last-child{width:58%;margin-bottom:0}

/* skeleton: l'ingombro di una sezione, senza testo da leggere. Titoli spessi,
   paragrafi sottili, immagini barrate: si vede la densita' e il bilanciamento
   anche quando il contenuto vero non c'e' ancora. */
.skel>*+*{margin-top:var(--s3)}
.skel .ph{min-height:104px}
.lines.hd i{height:15px;background:var(--fill-3);border-color:var(--line-2)}
.lines.hd i:last-child{width:62%}

/* pannello a scomparsa: non e' una finestra vera, e' il disegno di una. La pagina
   sotto resta visibile e attenuata, cosi' si vede cosa copre e quanto. */
.drw{position:relative;overflow:hidden;min-height:360px;border-bottom:1px solid var(--line);background:var(--paper)}
.drw>.bg{padding:var(--s5);opacity:.42}
.drw>.pn{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:82%;display:flex;flex-direction:column;
  background:var(--paper);border-left:1px solid var(--line-2);box-shadow:var(--z4)}
.drw>.pn>header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.drw>.pn>header h4{font-size:var(--t4)}

/* il chiudi e' un bersaglio, non una scritta: 30px di lato come ogni controllo */
.drw>.pn>header .x,.mdl>.dlg>header .x{display:inline-flex;align-items:center;justify-content:center;min-height:var(--ctl-sm);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t7);text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);border:1px solid var(--line);padding:0 var(--i3);cursor:pointer;
  transition:border-color var(--d1) ease,color var(--d1) ease}
.drw>.pn>header .x:hover,.mdl>.dlg>header .x:hover{border-color:var(--ink);color:var(--ink)}
.drw>.pn>.bd{flex:1;overflow-y:auto;padding:var(--s4)}
.drw>.pn>.ft{padding:var(--s4);border-top:1px solid var(--line);background:var(--fill)}
.drw>.pn>.ft .acts{margin-top:var(--s3)}

/* LA MODALE — come il pannello a scomparsa, non e' una finestra vera: e' il disegno
   di una. La pagina sotto resta visibile sotto uno strato scuro, cosi' il cliente
   vede cosa la modale interrompe. Entra in 280ms salendo di 8px: aprire e' un gesto
   deciso, e 8px sono abbastanza per leggerlo senza far sobbalzare la pagina. */
.mdl{position:relative;overflow:hidden;min-height:400px;border-bottom:1px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:center}
.mdl>.bg{position:absolute;inset:0;padding:var(--s5);opacity:.42;overflow:hidden}
.mdl::before{content:"";position:absolute;inset:0;background:rgba(22,24,26,.34)}
.mdl>.dlg{position:relative;z-index:1;width:min(460px,86%);max-height:86%;display:flex;flex-direction:column;
  background:var(--paper);border:1px solid var(--line-2);box-shadow:var(--z4)}
.mdl>.dlg.wide{width:min(720px,92%)}
.mdl>.dlg>header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.mdl>.dlg>header h4{font-size:var(--t4)}
.mdl>.dlg>.bd{flex:1;overflow-y:auto;padding:var(--s5) var(--s4);font-size:var(--t5);line-height:1.55;color:var(--ink-2)}
.mdl>.dlg>.ft{padding:var(--s4);border-top:1px solid var(--line);background:var(--fill);
  display:flex;gap:var(--s2);justify-content:flex-end;flex-wrap:wrap}
.mdl>.dlg>.ft .acts{margin:0}

/* canvas 3D: il confine col motore. Bordo tratteggiato spesso e nessun tratteggio
   di fondo, cosi' non si confonde con ph(), che e' un'immagine HTML. La targhetta
   dice chi renderizza: dentro il WebGL, fuori il browser. */
.c3d{position:relative;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s3);text-align:center;padding:var(--s6) var(--s4);border:2px dashed var(--line-3);background:var(--fill)}
.c3d.tall{min-height:380px}
.c3d.full{position:absolute;inset:0;min-height:0}
.c3d>.tp{position:absolute;top:var(--s2);left:var(--s2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t7);
  text-transform:uppercase;letter-spacing:.09em;color:var(--paper);background:var(--ink);padding:1px 6px}
.c3d>.lb{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t5);letter-spacing:.05em;color:var(--ink-2)}
.c3d>.st{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t6);color:var(--ink-3);
  border-top:1px dashed var(--line-2);padding-top:var(--s2)}

/* 3D allo scroll: il canvas resta appiccicato in alto, il livello di testo gli
   scorre davanti tirato su di altrettanto. I blocchi stanno a meta' larghezza e si
   alternano ai lati: il centro della scena non si copre mai. */
.sy{position:relative;border-bottom:1px solid var(--line);background:var(--paper)}
.sy>.bgl{position:sticky;top:0;height:460px;z-index:0;padding:var(--s4)}
.sy>.ly{position:relative;z-index:1;margin-top:-460px;padding:var(--s7) var(--s5) var(--s6);
  display:flex;flex-direction:column;gap:var(--s7)}
.sy>.ly>header{max-width:32ch;margin-bottom:var(--s4)}
.sy>.ly>header h2{font-size:var(--t2)}
.sy .sy-b{width:min(340px,46%)}
.sy .sy-b.r{margin-left:auto}
.sy .sy-b .box{box-shadow:0 6px 24px rgba(0,0,0,.10)}
.sy>.pg{position:sticky;bottom:0;z-index:2;padding:var(--s3) var(--s5);background:var(--paper);border-top:1px solid var(--line)}

/* selettore di varianti: il quadratino e' un segnaposto, non un colore di brand */
.sw{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sw .lb{font-size:var(--t7);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-right:2px}
.sw .it{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--paper);
  border-radius:2px;padding:var(--i1) var(--i3) var(--i1) var(--i1);font-size:var(--t6);color:var(--ink-2);cursor:pointer;transition:border-color var(--d1) ease,color var(--d1) ease}
.sw .it:hover{border-color:var(--ink);color:var(--ink)}
.sw .it i{display:block;width:14px;height:14px;background:var(--fill-3);border:1px solid var(--line-2)}
.sw .it.on{border-color:var(--ink);color:var(--ink)}
.sw .it.on i{background:var(--ink)}

/* spazio 3D: l'ambiente prende tutto, l'interfaccia galleggia agli angoli e resta
   minima. Gli slot vuoti non occupano niente. */
.hud{position:relative;min-height:440px;padding:var(--s4);border-bottom:1px solid var(--line)}
.hud>.ph{position:absolute;inset:0;min-height:0}
.hud>.tl,.hud>.tr,.hud>.bl,.hud>.br,.hud>.mid{position:absolute;z-index:1;display:flex;flex-direction:column;gap:var(--s2);max-width:min(300px,42%)}
.hud>.tl{top:var(--s4);left:var(--s4)}
.hud>.tr{top:var(--s4);right:var(--s4);align-items:flex-end;text-align:right}
.hud>.bl{bottom:var(--s4);left:var(--s4)}
.hud>.br{bottom:var(--s4);right:var(--s4);align-items:flex-end;text-align:right}
.hud>.mid{left:50%;top:50%;transform:translate(-50%,-50%);align-items:center;text-align:center;max-width:44ch}
.hud .note,.hud .btn,.hud .tag,.hud .metric,.hud .sw .it{background:rgba(255,255,255,.88)}
.hud>.c3d{background:var(--fill)}
.hud .note{padding:var(--s2) var(--s3);font-size:var(--t6);margin:0;max-width:none}
.hud .mono{display:block}

.metric{background:var(--paper);border:1px solid var(--line);padding:var(--s4)}
.metric b{display:block;font-size:var(--t1);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.metric span{display:block;font-size:var(--t6);color:var(--ink-3);margin-top:var(--i2)}
.metric em{display:block;font-style:normal;font-size:var(--t6);color:var(--ink-3);margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--line)}

ul.lst{list-style:none;background:var(--paper);border:1px solid var(--line)}
ul.lst li{padding:var(--i4) var(--s4);border-bottom:1px solid var(--line);display:flex;gap:var(--s4);
  align-items:center;min-height:var(--ctl-lg);font-size:var(--t5);transition:background var(--d1) ease}
ul.lst li:last-child{border-bottom:none}
ul.lst li:hover{background:var(--fill)}
ul.lst li .g{flex:1;min-width:0}
ul.lst li small{display:block;font-size:var(--t6);color:var(--ink-3);margin-top:var(--i1);line-height:1.45}
ul.lst li .r{flex:none;display:flex;gap:var(--i3);align-items:center;font-size:var(--t6);color:var(--ink-3)}
ul.lst li b{font-weight:600}
label.ck{display:flex;gap:var(--s2);align-items:flex-start;cursor:pointer;flex:1}
label.ck input{margin-top:3px;flex:none}
label.ck.done .g>b{text-decoration:line-through;color:var(--ink-4)}

.tbl{border:1px solid var(--line);background:var(--paper)}
.tbl .tools{display:flex;gap:var(--s2);align-items:center;padding:var(--i3) var(--s3);border-bottom:1px solid var(--line);background:var(--fill);flex-wrap:wrap}
/* il filtro e' un controllo, non un'etichetta: ha l'altezza degli altri e reagisce */
.tbl .tools .f{display:inline-flex;align-items:center;min-height:var(--ctl-sm);border:1px solid var(--line-2);background:var(--paper);
  padding:0 var(--i4);font-size:var(--t6);color:var(--ink-3);border-radius:2px;cursor:pointer;
  transition:border-color var(--d1) ease,color var(--d1) ease}
.tbl .tools .f:hover{border-color:var(--ink);color:var(--ink)}
.tbl .tools .f.s{flex:1;min-width:130px;max-width:250px}
.tbl .tools .n{margin-left:auto;font-size:var(--t6);color:var(--ink-3)}
.tbl .scr{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:var(--t5)}
table.tb th,table.tb td{padding:var(--i4) var(--s3);text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb th{font-size:var(--t7);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;white-space:nowrap;background:var(--paper)}
table.tb th::after{content:" ⇅";color:var(--line-2)}
table.tb th.n::after{content:""}
table.tb tbody tr{transition:background var(--d1) ease}
table.tb tbody tr:hover{background:var(--fill)}
table.tb tr:last-child td{border-bottom:none}
table.tb td small{display:block;color:var(--ink-3);font-size:var(--t6)}
.tbl .pager{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--i3) var(--s3);border-top:1px solid var(--line);background:var(--fill);font-size:var(--t6);color:var(--ink-3)}
.tbl .pager .pg{display:flex;gap:4px}
.tbl .pager .pg span{display:inline-flex;align-items:center;justify-content:center;min-width:24px;min-height:24px;border:1px solid var(--line-2);padding:0 var(--i3);background:var(--paper);cursor:pointer;transition:border-color var(--d1) ease}
.tbl .pager .pg span:hover{border-color:var(--ink)}
.tbl .pager .pg span[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

details.acc{background:var(--paper);border:1px solid var(--line);margin-bottom:6px}
details.acc>summary{padding:var(--i4) var(--s4);min-height:var(--ctl-lg);cursor:pointer;font-size:var(--t5);display:flex;gap:var(--s3);align-items:center;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"▸";color:var(--ink-3);flex:none;font-size:var(--t6);transition:transform var(--d2) var(--e-in)}
details.acc[open]>summary::before{content:"▾"}
details.acc>summary .g{flex:1}
details.acc>summary small{display:block;color:var(--ink-3);font-size:var(--t6)}
details.acc .in{padding:0 var(--s4) var(--s4) 34px;font-size:var(--t5);line-height:1.5;color:var(--ink-2);max-width:68ch}
details.acc .in h5{font-size:var(--t7);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-4);margin:var(--s3) 0 6px}

.tag{display:inline-flex;align-items:center;font-size:var(--t7);letter-spacing:.02em;border:1px solid var(--line-2);
  min-height:20px;padding:0 var(--i3);color:var(--ink-2);background:var(--paper);white-space:nowrap;border-radius:2px}
.tag.k{background:var(--fill-2)}
.tag.x{border-style:dashed;color:var(--ink-4)}
.tag.b{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:var(--i3);background:var(--fill-2);border:1px solid var(--line);margin-top:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--line-3);transition:width var(--d3) var(--e-in)}

/* IL CAMPO — etichetta sempre sopra e sempre visibile: il placeholder dentro il
   campo sparisce appena si scrive, e un wireframe non puo' permettersi un'etichetta
   che sparisce. L'aiuto sta sotto, e occupa spazio anche quando e' vuoto, cosi' il
   modulo non salta mentre si compila. */
.fld{margin-bottom:var(--s4)}
.fld label{display:block;font-size:var(--t6);font-weight:500;color:var(--ink-2);margin-bottom:var(--i3)}
.fld input,.fld select,.fld textarea{width:100%;min-height:var(--ctl);padding:0 var(--i4);font-size:var(--t5);
  color:var(--ink);border:1px solid var(--line-2);background:var(--paper);border-radius:2px;
  transition:border-color var(--d1) ease,box-shadow var(--d1) ease}
.fld textarea{min-height:88px;padding:var(--i4);resize:vertical;line-height:1.5}
.fld input:hover,.fld select:hover,.fld textarea:hover{border-color:var(--line-3)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--ink);box-shadow:var(--ring)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink-4)}
.fld .hint{font-size:var(--t6);color:var(--ink-3);margin-top:var(--i2);line-height:1.4}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s4)}
/* IL BOTTONE — la gerarchia la fa il bordo, non solo il fondo: pieno, bordato,
   nudo. Tre forze distinte a colpo d'occhio, senza un grammo di colore. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--i3);
  min-height:var(--ctl);min-width:88px;padding:var(--i3) var(--s4);
  font-size:var(--t5);font-weight:500;line-height:1;
  border:1px solid var(--line-3);background:var(--paper);color:var(--ink-2);
  position:relative;border-radius:2px;white-space:nowrap;
  transition:background var(--d1) ease,border-color var(--d1) ease,color var(--d1) ease,box-shadow var(--d1) ease}
.btn:hover{border-color:var(--ink);color:var(--ink);box-shadow:var(--z1)}
/* il press non si anima, si sente: 60ms, meta' di tutto il resto */
.btn:active{transform:translateY(1px);box-shadow:none;transition-duration:60ms}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2);color:#fff;box-shadow:var(--z2)}
.btn.sm{min-height:var(--ctl-sm);min-width:0;padding:var(--i2) var(--i4);font-size:var(--t6)}
.btn.lg{min-height:var(--ctl-lg);min-width:132px;padding:var(--i3) var(--s5);font-size:var(--t4)}
.btn.lnk{border:none;background:none;min-width:0;min-height:0;padding:0;font-size:var(--t5);
  text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.btn.lnk:hover{box-shadow:none;background:none;text-decoration-thickness:2px}
/* in attesa: nel wireframe e' la sola cosa che spiega perche' lo schermo non cambia */
.btn.busy{color:var(--ink-3);pointer-events:none}
.btn.busy::before{content:"\00b7\00b7\00b7";animation:bpulse 1.6s linear infinite}
@keyframes bpulse{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.btn[aria-disabled="true"]{border-style:dashed;border-color:var(--line-2);color:var(--ink-4);background:var(--paper);cursor:help}
.btn[aria-disabled="true"]:hover{box-shadow:none;border-color:var(--line-2);color:var(--ink-4)}
.btn[aria-disabled="true"]:active{transform:none}
.btn[aria-disabled="true"]::after{content:"✕";position:absolute;top:-6px;right:-6px;font-size:9px;background:var(--paper);border:1px solid var(--line-2);width:14px;height:14px;line-height:12px;text-align:center;border-radius:50%;color:var(--ink-3)}
.btn.pri[aria-disabled="true"]{background:var(--paper)}

.no{border:1px dashed var(--line-2);background:repeating-linear-gradient(45deg,transparent,transparent 10px,var(--fill) 10px,var(--fill) 20px);padding:var(--s4)}
.no h4{font-size:var(--t5);color:var(--ink-2);margin-bottom:var(--i2)}
.no p{font-size:var(--t6);color:var(--ink-3);line-height:1.5;max-width:68ch}
.note{border-left:3px solid var(--line-3);background:var(--fill);padding:var(--s3) var(--s4);font-size:var(--t5);
  line-height:1.5;color:var(--ink-2);max-width:68ch}
.note b{color:var(--ink)}
.empty{border:1px dashed var(--line-2);padding:var(--s6) var(--s5);text-align:center;color:var(--ink-3);font-size:var(--t5);line-height:1.5;background:var(--fill)}

.ann{counter-reset:a}
.ann .a{display:flex;gap:var(--s2);font-size:11.5px;color:var(--ink-2);margin-bottom:var(--s2);line-height:1.45}
.ann .a::before{counter-increment:a;content:counter(a);flex:none;width:17px;height:17px;border:1px solid var(--line-2);border-radius:50%;font-size:9.5px;text-align:center;line-height:15px;font-family:ui-monospace,Menlo,monospace;color:var(--ink-3)}
.side .can li,.side .cant li{list-style:none;font-size:11.5px;line-height:1.45;padding-left:15px;position:relative;margin-bottom:5px;color:var(--ink-2)}
.side .can li::before{content:"✓";position:absolute;left:0;color:var(--ink)}
.side .cant li::before{content:"✕";position:absolute;left:0;color:var(--ink-4)}
.side .lvl{border:1px solid var(--line-2);padding:var(--s2) var(--s3)}
.side .lvl b{display:block;font-size:12.5px}
.side .lvl span{color:var(--ink-3);font-size:11.5px}
.log{border:1px solid var(--line);max-height:220px;overflow-y:auto}
.log div{padding:6px 9px;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink-3)}
.log div:last-child{border-bottom:none}
.log div b{color:var(--ink)}
.log .empty{border:none;padding:var(--s3);font-family:inherit;font-size:11.5px}

.toast{position:fixed;left:50%;bottom:var(--dock);transform:translateX(-50%);background:var(--ink);color:#fff;padding:var(--i4) var(--s4);font-size:var(--t5);animation:toastIn var(--d2) var(--e-in);z-index:95;max-width:88vw;border-radius:2px}
.toast.warn{background:var(--paper);color:var(--ink);border:1px dashed var(--ink)}
/* il toast e' creato da JS e rimosso da JS: nasce una volta, quindi si anima davvero */
@keyframes toastIn{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.cookie{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line-2);box-shadow:0 18px 50px rgba(0,0,0,.28);padding:var(--s5);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;z-index:95}
.cookie p{font-size:var(--t5);color:var(--ink-2);width:100%;margin-bottom:var(--s3);line-height:1.5}
.cookie .btn{flex:1;justify-content:center;text-align:center}
.cookie .skip{width:100%;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);text-align:center;text-decoration:underline;text-underline-offset:2px}
.cookie .skip:hover{color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:94;background:rgba(22,24,26,.34);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}

@media (max-width:1240px){ aside.side{display:none} }
body.solo .rail,body.solo aside.side{display:none}
@media (max-width:980px){
  .hero{grid-template-columns:1fr;gap:var(--s4);padding:var(--s6) var(--s4)}
  .sf .cols{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:1fr}
  .appnav{width:160px}
}
@media (max-width:820px){
  .layout{flex-direction:column}
  .rail{width:100%;position:static;height:auto;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line-2);padding:0}
  .rail>.hd{display:none}
  .rail .grp{border-top:none;white-space:nowrap}
  .rail a{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  .rail a[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--role)}
  .rail a .t{display:none}
  .canvas{padding:0}
  .page{border-left:none;border-right:none}
  .appbody{flex-direction:column}
  .appnav{width:100%;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:0}
  .appnav .grp{display:none}
  .appnav a{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  .appnav a[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--role)}
  .content,.band,.crumb,.phead,.tabs{padding-left:var(--s4);padding-right:var(--s4)}
}

/* ══ LA TELA DELL'ARCHITETTURA ══
   Schermo pieno: via indice, pannello e barra del simulatore. Resta la tela e due
   strumenti. Il mondo e' un solo elemento con una transform, quindi spostarsi e
   ingrandire non ridisegnano niente. */
body.archfull .sim,body.archfull .rail,body.archfull aside.side{display:none}
body.archfull .layout{height:100%}
body.archfull .canvas{overflow:hidden;background:var(--fill)}
body.archfull .canvas>.cv{padding:0;height:100%}
.archcv{position:relative;width:100%;height:100%;min-height:70vh;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:26px 26px}
.archcv.grab{cursor:grabbing}
.archcv[data-atool="pen"]{cursor:crosshair}
.archcv[data-atool="txt"]{cursor:text}
.aworld{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
/* il foglio segue il mondo: la misura la detta il diagramma, non un max-width */
.aworld .page,.aworld .page.wide{margin:0;width:100%;max-width:none;box-shadow:var(--z2)}
/* il tratto e l'appunto sono rossi: non sono il progetto, sono quello che hai da
   dire sul progetto. Sopra la mappa, e sempre cliccabili anche da spenti. */
.aink{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:5}
.aink path{fill:none;stroke:var(--ko);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
/* 2.4px di inchiostro non si colpiscono col mouse: sotto ogni tratto ne corre uno
   spesso e invisibile, che fa da bersaglio. */
.aink path.hit{stroke:transparent;stroke-width:16;opacity:1}
.archcv[data-atool="pen"] .aink{pointer-events:auto}
.archcv[data-atool="sel"] .aink{pointer-events:auto}
.archcv[data-atool="sel"] .aink g{cursor:move}
.archcv[data-atool="sel"] .aink g:hover path:not(.hit){stroke-width:4}
.aink g.on path:not(.hit){stroke-width:4;stroke-dasharray:7 4}
.anote{position:absolute;z-index:6;display:flex;align-items:flex-start;gap:var(--i2);max-width:260px;
  background:var(--paper);border:1px solid var(--ko);border-left-width:3px;padding:var(--i3) var(--i4);
  box-shadow:var(--z2)}
.anote span{font-size:var(--t6);line-height:1.45;color:var(--ko);min-width:70px;outline:none}
.anote span:empty::before{content:"scrivi qui";color:var(--ink-4)}
.anote button{flex:none;font-size:var(--t6);line-height:1;color:var(--ink-4);padding:0 2px}
.anote button:hover{color:var(--ko)}
.archcv[data-atool="sel"] .anote{cursor:move}
.archcv[data-atool="sel"] .anote span{pointer-events:none;user-select:none}
.anote.on{outline:2px dashed var(--ko);outline-offset:3px}
.dock.arch .azoom{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t6);color:var(--ink-2);min-width:42px;text-align:center}
.dock.arch button.pen.on{background:rgba(168,51,47,.92);color:#fff}
/* il selettore di ruolo nella barra: la barra sta in fondo, quindi il menu sale */
.dock .who{display:flex;align-items:center;gap:var(--i3);flex:none}
.dock .who .lab{font-size:var(--t7);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.dock .pick{flex:none}
.dock .pick .cur{background:rgba(255,255,255,.7);border-color:rgba(22,24,26,.12);font-size:var(--t6);padding:var(--i2) var(--i3)}
.dock .pick .menu{top:auto;bottom:calc(100% + 8px)}

/* ══ ARCHITETTURA ══
   Il diagramma non misura il DOM: le posizioni le decide il motore in px e le
   scrive inline, cosi' le linee dell'SVG e i nodi cadono nello stesso posto senza
   un solo calcolo di layout da leggere. */
.arch .content{padding:var(--s5)}
.archscr{overflow:visible;padding-bottom:var(--s2)}
.archmap{position:relative;flex:none}
.archmap svg{position:absolute;inset:0;overflow:visible}
.archmap svg path{fill:none;stroke:var(--line-3);stroke-width:1.4}
.archmap svg marker path{fill:var(--line-3);stroke:none}
.archmap .nd{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:var(--i1);
  padding:0 var(--s3);background:var(--paper);border:1px solid var(--line-2);border-radius:2px;
  text-decoration:none;cursor:pointer;overflow:hidden;
  transition:border-color var(--d1) ease,box-shadow var(--d1) ease}
.archmap .nd:hover{border-color:var(--ink);box-shadow:var(--z2)}
.archmap .nd b{font-size:var(--t5);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.archmap .nd small{font-size:var(--t7);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.archmap .nd.on{border-color:var(--ink);border-width:2px}
.archmap .nd.off{background:var(--fill);border-style:dashed;color:var(--ink-3)}
.archmap .nd.off b{font-weight:400}

/* un flusso per riga: i passi in catena, le deviazioni appese sotto al passo */
.archfl{display:flex;align-items:flex-start;gap:var(--s2);flex-wrap:wrap}
.archfl .pc{display:flex;flex-direction:column;gap:var(--i3);width:210px;flex:none}
.archfl .st{background:var(--paper);border:1px solid var(--line-2);padding:var(--s3);position:relative}
.archfl .st .n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t7);color:var(--ink-3)}
.archfl .st b{display:block;font-size:var(--t5);margin:var(--i1) 0 var(--i2)}
.archfl .st small{display:block;font-size:var(--t6);color:var(--ink-2);line-height:1.45}
.archfl .st .who{display:inline-block;margin-top:var(--s2);font-size:var(--t7);text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--line);padding:0 var(--i2)}
.archfl .st .end{display:block;margin-top:var(--s2);font-size:var(--t7);text-transform:uppercase;
  letter-spacing:.06em;color:var(--paper);background:var(--ink);padding:var(--i1) var(--i3)}
.archfl .er{border-left:3px solid var(--ko);background:var(--fill);padding:var(--i3) var(--s3);margin-left:var(--s3)}
.archfl .er b{display:block;font-size:var(--t6);color:var(--ko)}
.archfl .er small{display:block;font-size:var(--t6);color:var(--ink-2);line-height:1.45;margin-top:var(--i1)}
.archfl .ar{align-self:center;color:var(--line-3);font-size:var(--t3);flex:none;padding:0 var(--i1)}

/* ══ FLUSSI ══ */
.flow{background:var(--paper);border:1px solid var(--line-2);border-left:3px solid var(--ok);margin-bottom:var(--s4);border-radius:2px}
.flow.ko{border-left-color:var(--ko)}
.flow .fh{display:flex;align-items:center;gap:10px;padding:8px var(--s3);border-bottom:1px solid var(--line);font-size:12.5px}
.flow .fh b{font-weight:600}
.flow .fh .mut{margin-left:auto;font-size:11.5px}
.flow .fd{display:flex;gap:4px}
.flow .fd i{width:18px;height:4px;background:var(--fill-3);border-radius:2px;cursor:pointer}
.flow .fd i.done{background:var(--line-3)}
.flow .fd i.now{background:var(--ok)}
.flow.ko .fd i.now{background:var(--ko)}
.flow .fb{display:flex;align-items:center;gap:10px;padding:10px var(--s3);flex-wrap:wrap}
.flow .fb b{font-weight:600;font-size:13.5px}
.flow .fb .fix{color:var(--ink-3);font-size:12.5px;border-left:1px solid var(--line);padding-left:10px}
.flow .fb .nav{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.flow .fb .end{font-size:12px;color:var(--ok);border:1px solid var(--ok);padding:2px 9px;border-radius:2px}
.flow .fe{display:flex;align-items:center;gap:var(--s2);padding:8px var(--s3);border-top:1px dashed var(--line-2);background:var(--fill);flex-wrap:wrap}
.flow .fe .mut{font-size:10px;text-transform:uppercase;letter-spacing:.09em}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.ko{border-color:var(--ko);color:var(--ko)}
.btn.ko{border-color:var(--ko);color:var(--ko)}
@media (max-width:900px){
  .flow .fh .mut{margin-left:0;width:100%}
  .flow .fb .nav{margin-left:0}
}

/* ══ UX: ANALISI PER SEZIONE ══ */
[data-ux]{position:relative}
[data-ux]:not(.uxg){outline:1px dashed var(--line-2);outline-offset:-1px}
[data-uxon]{outline:2px solid var(--ink)}
.uxn{position:absolute;top:8px;left:8px;z-index:6;width:20px;height:20px;border:1px solid var(--line-3);background:var(--paper);border-radius:50%;font-family:ui-monospace,Menlo,monospace;font-size:10px;line-height:18px;text-align:center;color:var(--ink-2);cursor:pointer}
.uxn.rv{background:var(--ink);border-color:var(--ink);color:#fff}
.uxn.nw{border-style:dashed;color:var(--ink-3)}
.uxg{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:var(--s6) var(--s5) var(--s6) var(--s7);border-bottom:1px solid var(--line);outline:1px dashed var(--line-3);outline-offset:-4px;background:repeating-linear-gradient(45deg,transparent,transparent 7px,var(--fill) 7px,var(--fill) 14px)}
.uxg b{font-size:14.5px}
.uxg>span:not(.uxn){font-size:12.5px;color:var(--ink-2);max-width:52ch}
.uxg em{margin-left:auto;font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.uxc .uxl{list-style:none;margin-top:var(--s2);font-size:11.5px;color:var(--ink-2)}
.uxc .uxl li{position:relative;padding-left:13px;margin-bottom:4px;line-height:1.45}
.uxc .uxl li::before{content:"–";position:absolute;left:0;color:var(--ink-4)}
.uxc .uxl.todo li::before{content:"→";color:var(--ink)}
.uxbar{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.uxc .add{display:flex;gap:var(--s3);margin-top:var(--s2)}
.uxc .add button{font-size:10.5px;color:var(--ink-4)}
.uxc .add button:hover{color:var(--ink)}
.uxc [contenteditable]{display:inline-block;min-width:40px;border-bottom:1px solid transparent;cursor:text}
.uxc [contenteditable]:hover{border-bottom-color:var(--line-2)}
.uxc [contenteditable]:focus{outline:none;background:var(--paper);border-bottom-color:var(--ink)}
.uxc [contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-4)}
.uxc .uxl:empty{display:none}
[data-uxdraft]{outline:1px dashed var(--line-3);outline-offset:-4px;background-image:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(0,0,0,.022) 9px,rgba(0,0,0,.022) 18px)}
[data-uxdraft]::after{content:"bozza";position:absolute;top:8px;right:8px;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);border:1px dashed var(--line-3);background:var(--paper);padding:1px 6px}

/* ══ MATITA ROSSA ══ */
.page{position:relative}
.pinl{position:absolute;inset:0;pointer-events:none;z-index:40}
.pinl.on{cursor:crosshair;background:rgba(168,51,47,.03)}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;width:22px;height:22px;border-radius:50%;background:var(--ko);color:#fff;border:2px solid var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.3);font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:18px;text-align:center;cursor:pointer}
.pin.on{outline:2px solid var(--ko);outline-offset:2px}
.sim .tog label.pen input:checked+*,.sim .tog label.pen:has(input:checked){color:var(--ko);font-weight:600}
.note.red{border-left-color:var(--ko);color:var(--ko)}
.pinlist{list-style:none}
.pinlist li{display:flex;gap:var(--s2);align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.pinlist li.on{background:var(--fill)}
.pinlist .pin{position:static;transform:none;flex:none;box-shadow:none;border-width:1px}
.pinlist li>span[contenteditable]{flex:1;font-size:11.5px;color:var(--ink-2);cursor:text;border-bottom:1px solid transparent}
.pinlist li>span[contenteditable]:hover{border-bottom-color:var(--line-2)}
.pinlist li>span[contenteditable]:focus{outline:none;border-bottom-color:var(--ko)}
.pinlist li>span[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-4)}
.pinlist li>button{flex:none;color:var(--ink-4);font-size:13px;line-height:1}
.pinlist li>button:hover{color:var(--ko)}
.uxn.rv{background:var(--ko);border-color:var(--ko)}

/* ══ EDITOR DEI TESTI ══ */
.tx{cursor:text;border-radius:2px}
.tx:hover{box-shadow:0 0 0 1px var(--line-2)}
.tx:focus{outline:none;box-shadow:0 0 0 2px var(--ink)}
.txch{background:rgba(168,51,47,.09);box-shadow:0 0 0 1px rgba(168,51,47,.25)}
.txlist{list-style:none}
.txlist li{display:grid;grid-template-columns:1fr auto;gap:2px var(--s2);padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.txlist .o{color:var(--ink-4);text-decoration:line-through}
.txlist .n{color:var(--ko);grid-column:1}
.txlist li>button{grid-row:1/3;grid-column:2;align-self:start;color:var(--ink-4);font-size:13px;line-height:1}
.txlist li>button:hover{color:var(--ko)}

/* ══ PALETTE E TRASCINAMENTO ══ */
.uxpal{border:1px solid var(--line);background:var(--fill);padding:var(--s2);margin-bottom:var(--s3)}
.uxpal .gr{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-4);margin:var(--s2) 0 4px}
.uxpal .gr:first-child{margin-top:0}
.uxpal .bs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.uxpal .it{display:block;border:1px solid var(--line-2);background:var(--paper);border-radius:4px;padding:4px;font-size:10px;line-height:1.25;color:var(--ink-3);cursor:pointer}
.uxpal .it:hover{border-color:var(--ink);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.uxpal .it .nm{display:block;margin-top:4px;padding:0 2px}
/* ruolo suggerito: un promemoria, non un permesso. I permessi stanno in acc e in A(). */
.uxpal .it .rl{display:block;font-weight:400;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-4);margin-top:1px}
/* la miniatura: il componente reso a larghezza piena e scalato */
.th{display:block;position:relative;overflow:hidden;height:62px;background:var(--paper);border:1px solid var(--line);border-radius:2px}
.th .in{position:absolute;top:0;left:0;width:1180px;transform:scale(.108);transform-origin:top left;pointer-events:none;background:var(--paper)}
/* anteprima a ingombro: stesse proporzioni, resa piu' larga e scalata meno, perche'
   di un componente fitto si legga almeno il peso. */
.th.sk .in{width:520px;transform:scale(.245);padding:var(--s3)}
/* nell'anteprima il canvas parla piu' forte: scritto a misura normale sparirebbe */
.th.sk .c3d>.lb{font-size:34px;line-height:1.2}
.th.sk .c3d>.st{font-size:21px;padding-top:var(--s3)}
.th.sk .c3d>.tp{font-size:19px;padding:2px 10px;top:12px;left:12px}
.th.sk .c3d{border-width:5px}
.thbox{display:block;width:120px;margin-bottom:6px}
.thbox .th{height:52px}
.uxn[draggable]{cursor:grab}
.uxn[draggable]:active{cursor:grabbing}
[data-uxdrop].dragover{outline:2px dashed var(--ink);outline-offset:-2px}
.uxc.dragover{background:var(--fill-2)}

/* ══ DOCK ══ */
.sim .b2 .lab{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
.sim .b2 .acc{margin-left:auto;border-left:none;padding-left:0}

.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:var(--i2);flex-wrap:nowrap;justify-content:center;max-width:calc(100vw - 24px);padding:var(--i3);border-radius:13px;
  background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 10px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
@supports not (backdrop-filter:blur(2px)){ .dock{background:rgba(255,255,255,.93)} }
.dock .g{display:flex;gap:3px;align-items:center}
.dock .sp{width:1px;align-self:stretch;background:rgba(22,24,26,.12);margin:3px 3px}
.dock button{flex:none;border:1px solid transparent;background:none;padding:var(--i3) var(--i4);border-radius:8px;font-size:12px;color:var(--ink-2);white-space:nowrap;transition:background .12s,color .12s}
.dock button:hover{background:rgba(22,24,26,.06);color:var(--ink)}
.dock button.on{background:rgba(22,24,26,.9);border-color:transparent;color:#fff}
.dock button.pen.on{background:rgba(168,51,47,.92)}
.dock select{background:rgba(255,255,255,.7);border:1px solid rgba(22,24,26,.12);padding:6px 9px;font-size:12px;border-radius:8px;max-width:180px}
@media (max-width:760px){
  .dock{left:8px;right:8px;transform:none;max-width:none}
  .dock button{padding:5px 8px;font-size:11.5px}
}

/* ══ GUSCIO DELL'EDITOR ══ */
.ed{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.ed .card{background:var(--paper);border:1px solid var(--line-2);max-width:560px;width:100%;padding:var(--s6);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.ed .logo{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:16px;letter-spacing:-.02em}
.ed .logo i{width:22px;height:22px;background:var(--ink);display:block}
.ed h1{font-size:var(--t2);margin:var(--s5) 0 var(--s2)}
.ed p{font-size:13px;color:var(--ink-2);margin-bottom:var(--s4);max-width:52ch}
.ed .btn{cursor:pointer}
.ed .mut{font-size:12px;color:var(--ink-3);margin:var(--s3) 0 var(--s5)}
.ed .note{margin-top:var(--s4)}
body.edrop .ed .card{outline:2px dashed var(--ink);outline-offset:6px}

/* ══ PANNELLO A BLOCCHI ══ */
.pb{border-bottom:1px solid var(--line)}
.pb>summary{list-style:none;cursor:pointer;padding:9px var(--s4);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.pb>summary::-webkit-details-marker{display:none}
.pb>summary::after{content:"+";margin-left:auto;font-size:13px;color:var(--ink-4)}
.pb[open]>summary{color:var(--ink);background:var(--fill)}
.pb[open]>summary::after{content:"\2212"}
.pb>summary:hover{background:var(--fill)}
.pb>.in{padding:0 var(--s4) var(--s4)}
.pb>.in>h4:first-child{margin-top:var(--s3)}

/* ══ IMPALCATURA A TUTTA ALTEZZA ══
   Barra sopra, tre colonne sotto che scorrono ognuna per conto suo: nessun offset
   da tenere allineato a mano, quindi nessuno spazio vuoto sotto la barra. */
@media (min-width:901px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .sim{flex:none}
  .layout{flex:1;min-height:0;align-items:stretch}
  .rail,aside.side,.canvas{height:100%;overflow-y:auto}
  .rail>.hd,aside.side>.hd{position:sticky;top:0}
}

/* ══ MOBILE ══
   La pagina e' un contenitore: le sue regole responsive guardano la larghezza del
   wireframe, non quella della finestra. Cosi' il passaggio a 390px mostra davvero
   il layout da telefono, senza rimpicciolire la finestra del browser. */
body.mob .page,body.mob .page.wide{max-width:390px;border-radius:20px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.24)}
body.mob .canvas>.cv{padding-top:var(--s6)}
@container (max-width:980px){
  .hero{grid-template-columns:1fr;gap:var(--s4);padding:var(--s6) var(--s4)}
  .sf .cols{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:1fr}
  .appnav{width:160px}
  .row.c4{grid-template-columns:1fr 1fr}
}
@container (max-width:820px){
  /* !important perche' la misura di ogni voce e' inline: su telefono la composizione
     si semplifica a due colonne, ma la carta millimetrata e i tagli restano. */
  .grd{grid-template-columns:1fr 1fr}
  .grd>*{grid-column:span 1!important}

/* ══ COMPONENTI IN VERSIONE TELEFONO ══ */
@container (max-width:820px){
  /* barra: logo, azione principale, panino. Il resto entra nel pannello.
     --shpad e' il fianco della barra, dichiarato una volta sola: il pannello lo

     una seconda volta e sbordare. */

/* azione: permessa -> bottone vivo; non permessa -> bottone barrato che spiega perché */
function A(o){
  const ok = !o.roles || o.roles.indexOf(S.role) >= 0;
  /* sm/lg sono le due misure oltre alla standard; busy dice "qui c'e' un'attesa",
     ed e' la sola cosa che spiega al cliente perche' lo schermo non cambia subito */
  const cls = 'btn' + (o.pri ? ' pri' : '') + (o.sm ? ' sm' : '') + (o.lg ? ' lg' : '') +
              (o.lnk ? ' lnk' : '') + (o.busy ? ' busy' : '');
  if(ok) return '<button class="' + cls + '" data-do="' + (o.act || 'noop') + '" data-arg="' + esc(o.arg == null ? '' : o.arg) + '">' + o.label + '</button>';
  return '<button class="' + cls + '" aria-disabled="true" data-why="' + esc(o.why || 'Il tuo ruolo non può fare questa azione.') + '">' + o.label + '</button>';
}
function stat(v, k, d){ return metric(v, k, d); }
function no(t, p){ return '<div class="no"><h4>' + t + '</h4><p>' + p + '</p></div>'; }
function ph(t, cls){ return '<div class="ph ' + (cls || '') + '">' + t + '</div>'; }
function metric(v, k, d){ return '<div class="metric"><b>' + v + '</b><span>' + k + '</span>' + (d ? '<em>' + d + '</em>' : '') + '</div>'; }
function tasks(who){
  return '<ul class="lst">' + DB.tasks.filter(t => t.who === who).map((t, i) => {
    const idx = DB.tasks.indexOf(t);
    return '<li><label class="ck' + (t.done ? ' done' : '') + '"><input type="checkbox" data-do="task" data-arg="' + idx + '"' + (t.done ? ' checked' : '') + '><span class="g"><b>' + t.t + '</b><small>' + t.s + '</small></span></label></li>';
  }).join('') + '</ul>';
}

/* ── AZIONI ──────────────────────────────────────── */
function log(m){
  const d = new Date();
  S.log.unshift({t:('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2), r:role().name, m:m});
}
function toast(msg, warn){
  const old = $('.toast'); if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.remove(), 3600);
}
function val(id, fb){ const e = document.getElementById(id); return (e && e.value) ? e.value : fb; }

/* ── chrome dell'applicazione ── */
function appChrome(s, body){
  const r = role();
  const link = (x, label, cur) => {
    /* pallino sulla voce: quante cose aspettano li' dentro. Un numero secco, o
       {ruolo:n} se il conto cambia da ruolo a ruolo. Su una voce chiusa non esce:
       non si conta quello che non si puo' aprire. */
    const b = x.badge && typeof x.badge === 'object' ? x.badge[S.role] : x.badge;
    return '<a data-screen="' + x.id + '" class="' + (lvl(x) === 'none' ? 'off' : '') + '" aria-current="' + cur + '">' + (label || x.label) +
      (b && lvl(x) !== 'none' ? '<b class="bg">' + b + '</b>' : '') + '</a>';
  };
  /* NAV[ruolo] nello spec: la barra condensata di quel ruolo. Una voce e' un id, o
     {id, label, sub:[id], in:[id]}: le sub diventano tab in cima alla pagina, le in
     accendono la voce e basta (pagine aperte da un catalogo, non da un tab).
     Senza NAV, una voce per schermata dai GROUPS. */
  const custom = typeof NAV !== 'undefined' && NAV[S.role];
  const items = custom ? [].concat(...custom.map(g => g.items)).map(it => typeof it === 'string' ? {id:it} : it) : [];
  const here = items.find(o => o.id === s.id || (o.sub || []).includes(s.id) || (o.in || []).includes(s.id));
  const tabs = here && here.sub && (here.id === s.id || here.sub.includes(s.id))
    ? '<div class="apptabs">' + [here.id].concat(here.sub).map(scr).filter(Boolean).map((y, i) =>
        '<a data-screen="' + y.id + '" class="' + (lvl(y) === 'none' ? 'off' : '') + '" aria-current="' + (y.id === s.id) + '">' + (i ? y.label : here.label || y.label) + '</a>').join('') + '</div>'
    : '';
  const nav = custom ? custom.map(g => '<div class="grp">' + g.h + '</div>' + g.items.map(it => {
      const o = typeof it === 'string' ? {id:it} : it;
      return link(scr(o.id), o.label, !!here && here.id === o.id);
    }).join('')).join('')
  : GROUPS.filter(g => g.id !== 'pub').map(g => {
    const items = SCREENS.filter(x => x.g === g.id).filter(x => !(S.hideOff && lvl(x) === 'none'));
    if(!items.length) return '';
    return '<div class="grp">' + g.name + '</div>' + items.map(x => link(x, null, x.id === s.id)).join('');
  }).join('');
  const gname = ((GROUPS.find(g => g.id === s.g) || {}).name) || '';
  const crumb = gname + ' / ' + s.label;
  return '<header class="ah">' +
      '<span class="logo"><i></i>' + BRAND.name + '</span><span class="sep"></span><span class="ctx">' + gname + '</span>' +
      '<span class="search">' + (BRAND.search || 'Cerca…') + '</span>' +
      '<span class="icons"><span class="ic">?</span><span class="ic">◎<b>' + ((BRAND.notif && BRAND.notif[S.role]) || 3) + '</b></span>' +
      '<span class="me"><i></i>' + r.name + '</span></span></header>' +
    '<div class="appbody"><nav class="appnav">' + nav + '</nav><div class="appmain">' +
      '<div class="crumb">' + crumb + '</div>' + tabs +
      '<div class="phead"><div><h1>' + s.title + '</h1><p>' + s.intro + '</p></div>' +
        '<div class="pa">' + (s.pa ? s.pa() : '') + '</div></div>' +
      (s.sub ? '<div class="tabs">' + s.sub.map((x, i) => '<span aria-current="' + (i === 0) + '">' + x + '</span>').join('') + '</div>' : '') +
      '<div class="content">' + body + '</div>' +
    '</div></div>';
}

/* ── FLUSSI ──────────────────────────────────────────
   Percorso corretto e diramazioni di errore. FLOWS nello spec e' facoltativo. */
const flows = () => (typeof FLOWS !== 'undefined' && FLOWS) || [];
const curFlow = () => S.flow && flows().find(f => f.id === S.flow.id);

function flowGo(f, k){
  if(k < 0 || k >= f.steps.length) return;
  const st = f.steps[k];
  S.flow.i = k; S.flow.err = null;
  if(st.role) S.role = st.role;
  S.screen = st.screen;
}
function flowEnter(id){
  const f = flows().find(x => x.id === id);
  if(!f) return;
  S.flow = {id:id, i:0, err:null};
  if(f.role) S.role = f.role;
  flowGo(f, 0);
  log('Flusso "' + f.name + '" avviato');
}
function flowDo(k, arg){
  const f = curFlow(); if(!f) return;
  const st = f.steps[S.flow.i];
  if(k === 'exit'){ S.flow = null; return; }
  if(k === 'next') return flowGo(f, S.flow.i + 1);
  if(k === 'prev') return flowGo(f, S.flow.i - 1);
  if(k === 'go')   return flowGo(f, +arg);
  if(k === 'back'){ S.flow.err = null; if(st.role) S.role = st.role; S.screen = st.screen; return; }
  if(k === 'err'){
    const e = (st.err || [])[+arg];
    if(!e) return;
    S.flow.err = +arg;
    if(e.role) S.role = e.role;
    if(e.screen) S.screen = e.screen;
    log('Deviazione: ' + e.name);
  }
}

function flowBar(){
  const f = curFlow(); if(!f) return '';
  const n = f.steps.length, i = S.flow.i, st = f.steps[i];
  const e = S.flow.err != null ? (st.err || [])[S.flow.err] : null;
  const who = ROLES.find(r => r.id === S.role);
  return '<div class="flow' + (e ? ' ko' : '') + '">' +
    '<div class="fh"><b>' + f.name + '</b>' +
      '<span class="fd">' + f.steps.map((x, k) =>
        '<i class="' + (k < i ? 'done' : k === i ? 'now' : '') + '" data-fdo="go" data-farg="' + k + '" title="' + (x.act || '') + '"></i>').join('') + '</span>' +
      '<span class="mut">passo ' + (i + 1) + ' di ' + n + ' \u00b7 ' + who.name + '</span>' +
      '<button class="btn sm" data-fdo="exit">Esci dal flusso</button></div>' +
    (e
      ? '<div class="fb"><span class="tag ko">Errore</span><b>' + e.name + '</b>' +
          (e.fix ? '<span class="fix">' + e.fix + '</span>' : '') +
          '<span class="nav"><button class="btn sm" data-fdo="back">Torna al percorso corretto</button></span></div>'
      : '<div class="fb"><span class="tag ok">Percorso corretto</span><b>' + (st.act || '') + '</b>' +
          (st.note ? '<span class="fix">' + st.note + '</span>' : '') +
          '<span class="nav">' +
            (i > 0 ? '<button class="btn sm" data-fdo="prev">\u2190</button>' : '') +
            (i < n - 1 ? '<button class="btn sm pri" data-fdo="next">Passo successivo \u2192</button>'
                       : '<span class="end">' + (st.end || 'Flusso completato') + '</span>') +
          '</span></div>' +
        ((st.err || []).length
          ? '<div class="fe"><span class="mut">Se qualcosa va storto</span>' +
            st.err.map((x, k) => '<button class="btn sm ko" data-fdo="err" data-farg="' + k + '">' + x.name + '</button>').join('') + '</div>'
          : ''))
  + '</div>';
}

function flowRail(){
  const F = flows(); if(!F.length) return '';
  return '<div class="grp">Flussi</div>' + F.map(f =>
    '<a data-flow="' + f.id + '" aria-current="' + (!!S.flow && S.flow.id === f.id) + '">' + f.name +
      '<span class="t">' + f.steps.length + ' passi</span></a>').join('');
}

/* ── UX: analisi per sezione ─────────────────────────
   'ux' nello spec e' facoltativo: una voce per ogni blocco di primo livello che
   la view rende, nello stesso ordine. Voci con st:'nuovo' non hanno un blocco:
   il motore le disegna come sezione proposta al posto giusto.
   Con il toggle acceso le voci si modificano e si spostano qui dentro: le
   modifiche restano in memoria (come DB), si portano dietro l'export, e
   "Copia ux" rida' il blocco da incollare nello spec. */
const VOIDT = {br:1, hr:1, img:1, input:1, link:1, meta:1, source:1, col:1, area:1, embed:1};
/* ponytail: scanner a profondita', non un parser HTML. Regge finche' nessun
   attributo contiene '>'. Se un giorno servira', qui va un parser vero. */
function uxBlocks(html){
  const re = /<(\/?)([a-zA-Z0-9]+)([^>]*?)(\/?)>/g, out = [];
  let d = 0, start = 0, m;
  while((m = re.exec(html))){
    if(m[4] === '/' || VOIDT[m[2].toLowerCase()]) continue;
    if(m[1]){ if(--d === 0) out.push([start, re.lastIndex]); }
    else { if(d++ === 0) start = m.index; }
  }
  return out;
}
const uxRole = u => !u.roles || u.roles.indexOf(S.role) >= 0;
/* nome dedotto dal blocco: il primo titolo che trova, o l'occhiello */
const UXFORMA = {hero:'Testata', band:'Fascia', sec:'Sezione', row:'Griglia', split:'Colonna + laterale',
                 tbl:'Tabella', lst:'Elenco', box:'Scheda', note:'Nota', form:'Modulo',
                 drw:'Pannello a scomparsa', hud:'Spazio 3D', skel:'Ingombro'};
function uxName(h, j){
  const m = h.match(/<h[1-5][^>]*>([\s\S]*?)<\/h[1-5]>/) || h.match(/class="kick"[^>]*>([\s\S]*?)</);
  const t = m ? m[1].replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim() : '';
  if(t) return t.slice(0, 64);
  const cls = (h.match(/^<[a-z0-9]+[^>]*class="([^"]*)"/) || [, ''])[1].split(' ');
  const f = cls.map(c => UXFORMA[c]).filter(Boolean)[0];
  return (f || 'Sezione') + ' ' + (j + 1);
}
/* una schermata senza ux nello spec non e' muta: il tool guarda i blocchi che rende
   e ne deduce l'elenco, cosi' si numerano, si spostano e si annotano tutte. */
function uxAuto(s){
  const html = lvl(s) === 'none' ? '' : s.view();
  return uxBlocks(html).map((r, j) =>
    ({n:uxName(html.slice(r[0], r[1]), j), goal:'', st:'ok', note:[], todo:[], _k:j, _auto:1}));
}
const uxTouched = l => l.some(u => u._k == null || !u._auto || u.goal || (u.note || []).length || (u.todo || []).length || (u.st || 'ok') !== 'ok');
function uxBase(s){
  if(s.ux && s.ux.length) return s.ux;
  if(!S.uxAuto[s.id] || S.uxAutoRole[s.id] !== S.role){ S.uxAuto[s.id] = uxAuto(s); S.uxAutoRole[s.id] = S.role; }
  return S.uxAuto[s.id];
}
/* copia di lavoro: da qui in poi si modifica questa, non lo spec */
function uxEnsure(s){
  const cur = S.uxEd[s.id];
  /* se l'elenco e' dedotto e nessuno l'ha toccato, si rifa' quando cambia il ruolo:
     una schermata puo' rendere blocchi diversi a ruoli diversi */
  if(cur && (!cur.length || !cur[0]._auto || uxTouched(cur) || S.uxAutoRole[s.id] === S.role)) return cur;
  S.uxEd[s.id] = uxBase(s).map((u, i) =>
    Object.assign({}, u, {_k:u._k == null ? i : u._k, note:(u.note || []).slice(), todo:(u.todo || []).slice()}));
  return S.uxEd[s.id];
}
const uxOf = s => (s.ux || []).filter(uxRole);          /* usata dal check */
const uxVis = s => uxEnsure(s).filter(uxRole);

/* ── CATALOGO DELLE SEZIONI ──────────────────────────
   Ogni voce: l = come si chiama, g = gruppo nella palette, w = dove ha senso
   (pub | app | both), d() = la bozza disegnata col kit, s = la riga da incollare
   nella view(). Aggiungerne una vuol dire aggiungere una riga qui. */
const UX3 = [1, 2, 3], UX4 = [1, 2, 3, 4];
const uxBox = i => ({h:'Titolo ' + i, p:'Testo da scrivere.'});
const UXK = {
  /* testate */
  hero:   {l:'Testata con immagine', g:'Testate', w:'pub',
           d:u => hero({kick:'Occhiello', h:u.n, p:u.goal, acts:[A({label:'Azione principale', pri:true}), A({label:'Secondaria'})],
                        trust:[['00','da definire'], ['00','da definire'], ['00','da definire']]}),
           s:"hero({kick:'…', h:%H, p:%P, acts:[A({label:'…', pri:true, act:'go', arg:'…'})], trust:[['00','…']]})"},
  heroTxt:{l:'Testata solo testo', g:'Testate', w:'pub',
           d:u => band({kick:'Occhiello', h:u.n, p:u.goal, acts:[A({label:'Azione', pri:true})]}),
           s:"band({kick:'…', h:%H, p:%P, acts:[A({label:'…', pri:true, act:'go', arg:'…'})]})"},

  /* ── negozio ──
     Vetrina e gestione dello stesso prodotto. Le voci `pub` sono il negozio che
     vede chi compra, quelle `app` il back-office di chi lo tiene: la barra
     laterale del back-office la mette già il motore dai GROUPS (Ordini, Prodotti,
     Clienti, Analitica sono schermate, non un componente). Chi può toccare cosa
     si dichiara sull'azione: A({roles:['admin']}). */
  pgrid:  {l:'Griglia prodotti', g:'Negozio', w:'pub', r:'cliente',
           th:() => skel([{s:[['h', {i:3}, {i:3}], ['h', 'p2', 'h', 'p2']]}]),
           d:u => band({kick:'Collezione', h:u.n, p:u.goal,
                        body:split(row(3, [1, 2, 3, 4, 5, 6].map(i => box({thumb:ph('foto prodotto · 1:1', 'wide x'),
                              h:'Prodotto ' + i, p:'Colore · materiale', meta:'00,00 €', acts:[A({label:'Aggiungi', sm:true})]}))),
                              box({h:'Filtri', body:lst([{t:'Taglia', s:'S · M · L · XL'}, {t:'Colore', s:'4 opzioni'},
                                    {t:'Prezzo', s:'da 00 a 000 €'}, {t:'Disponibilità', s:'solo pronta consegna'}]),
                                    acts:[A({label:'Azzera', sm:true})]}))}),
           s:"band({kick:'Collezione', h:%H, p:%P, body:split(row(3, [box({thumb:ph('foto · 1:1','wide x'), h:'…', meta:'00,00 €', acts:[A({label:'Aggiungi', sm:true})]})]), box({h:'Filtri', body:lst([{t:'Taglia', s:'S · M · L'}])}))})"},
