function render(){
  const r = role(), s = scr(S.screen) || SCREENS[0];
  const l = lvl(s);
  document.documentElement.style.setProperty('--role', r.color);
  const open = SCREENS.filter(x => lvl(x) !== 'none').length;
  let body = l === 'none' ? blockedBody(s) : s.view();
  const uxInfo = (S.ux && l !== 'none') ? uxApply(body, s) : null;
  if(uxInfo) body = uxInfo.html;
  else if(l !== 'none' && (s.ux || S.uxEd[s.id])) body = uxOrder(body, s);

  const pins = pinLayer(s) + inkLayer(s);
  const page = S.arch ? archView()
    : s.g === 'pub'
    ? '<div class="page">' + siteHeader(s) + (l === 'none' ? '<div class="content">' + body + '</div>' : body) + siteFooter() + pins + '</div>'
    : '<div class="page wide">' + appChrome(s, body) + pins + '</div>';

  const modo = S.arch ? 'Architettura' : S.ux ? 'Sezioni' : S.pen ? 'Segni rossi' : S.txt ? 'Testi' : 'Pannello';
  document.body.className = (S.solo ? 'solo' : '') + (S.mob ? ' mob' : '') + (S.arch ? ' archfull' : '');
  /* il ridisegno e' totale: senza questo, ogni clic riporterebbe tutto in cima */
  const keep = {}, same = S.scr0 === S.screen;
  ['.canvas', '.rail', 'aside.side'].forEach(k => { const el = $(k); if(el) keep[k] = el.scrollTop; });
  S.scr0 = S.screen;
  document.body.innerHTML =
  '<div class="sim">' +
    '<div class="b1"><span class="dots"><i></i><i></i><i></i></span>' +
      '<span class="url">https://' + s.url + '</span>' +
      '<span class="who"><span class="lab">come</span>' + rolePick(r) + '</span>' +
      '<span class="acc"><b>' + open + '</b>/' + SCREENS.length + ' schermate</span></div>' +
    '<div class="b2"><span class="lab">' + s.title + '</span><span class="mut">' + s.intro + '</span></div>' +
  '</div>' +
  '<div class="layout"><nav class="rail">' +
    '<div class="hd"><b>' + BRAND.name + '</b></div>' +
    '<div class="flt"><input id="rFlt" placeholder="filtra schermate" value="' + esc(S.filtro) + '">' +
      (S.filtro ? '<button data-xdo="flt0" title="Pulisci">\u00d7</button>' : '') + '</div>' +
    GROUPS.map(g => {
      const f = S.filtro.toLowerCase();
      const items = SCREENS.filter(x => x.g === g.id)
        .filter(x => !(S.hideOff && lvl(x) === 'none'))
        .filter(x => !f || (x.label + ' ' + x.title + ' ' + (x.url || '')).toLowerCase().indexOf(f) >= 0);
      if(!items.length) return '';
      /* gruppi a fisarmonica: aperto quello in cui sei (o tutti, se filtri); il
         titolo apre e chiude, e la scelta resta finche' non la cambi */
      const open = !!f || (g.id in S.rg ? S.rg[g.id] : g.id === s.g);
      return '<a class="grp' + (open ? ' open' : '') + '" data-xdo="rg:' + g.id + '">' + g.name + '<span class="n">' + items.length + '</span></a>' + (!open ? '' : items.map(x => {
        const xl = lvl(x);
        return '<a data-screen="' + x.id + '" class="' + (xl === 'none' ? 'off' : '') + '" aria-current="' + (x.id === s.id) + '">' +
          x.label + '<span class="t">' + (S.ux ? uxTag(x) : xl === 'none' ? 'chiuso' : xl === 'read' ? 'lettura' : xl === 'write' ? 'usa' : 'gestisce') + '</span></a>';
      }).join(''));
    }).join('') +
  flowRail() +
  '</nav><div class="canvas"><div class="cv">' + flowBar() + page + '</div></div><aside class="side"><div class="hd">' + modo + '</div>' + sidePanel(s, uxInfo) + '</aside></div>' + dock();

  Object.keys(keep).forEach(k => {
    const el = $(k);
    if(el && (same || k !== '.canvas')) el.scrollTop = keep[k];
  });
  /* chi ha cliccato porta l'altro a vedere lo stesso punto */
  if(S.uxSel != null && S.from){
    const t = $(S.from === 'side' ? '[data-uxon]' : '.uxc.on');
    if(t && t.scrollIntoView) t.scrollIntoView({block:'nearest'});
  }
  S.from = null;
  txtPaint();
  stSave();
  if(S.ff){
    const f = $('#rFlt');
    S.ff = false;
    if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  }
  if(S.pinFocus != null){
    const f = document.querySelector('[data-pinf="' + S.pinFocus + '"]');
    S.pinFocus = null;
    if(f) f.focus();
  }
  if(BRAND.cookie && S.role === ROLES[0].id && !S.ck){
    const c = document.createElement('div');
    c.className = 'cookie';
    c.innerHTML = '<p>' + BRAND.cookie + '</p>' +
      '<button class="btn sm" data-do="ck" data-arg="pref">Preferenze</button>' +
      '<button class="btn sm" data-do="ck" data-arg="no">Solo tecnici</button>' +
      '<button class="btn sm pri" data-do="ck" data-arg="ok">Accetta tutti</button>' +
      '<button class="skip" data-do="ck" data-arg="skip">Sto lavorando al wireframe: non mostrarlo più in questa sessione</button>';
    const sc = document.createElement('div');
    sc.className = 'scrim';
    document.body.appendChild(sc);
    document.body.appendChild(c);
  }
}

/* ── EVENTI ──────────────────────────────────────── */
document.addEventListener('click', e => {
  if(!e.target.closest('[data-pin],[data-pinf]')) S.pinLast = null;
  if(S.rmenu && !e.target.closest('.pick')){ S.rmenu = false; render(); return; }
  if(S.opts && !e.target.closest('.opts')){ S.opts = false; render(); return; }
  /* appunto: nasce dove hai cliccato, con il cursore gia' dentro. Sta qui e non nel
     pointerdown perche' il clic che seguiva finiva sul nodo sotto, e se ne andava. */
  if(S.arch && S.atool === 'txt' && e.target.closest('.archcv') && !e.target.closest('.dock')){
    e.preventDefault();
    const p = arcXY(e);
    snap('appunto');
    S.arc.txt.push({x:p.x, y:p.y, t:''});
    S.atool = 'pan';
    S.asel = null;
    render();
    const el = $('[data-anote="' + (S.arc.txt.length - 1) + '"] span');
    if(el && el.focus) el.focus();
    return;
  }
  const rBtn = e.target.closest('[data-role]');
  if(rBtn){
    S.role = rBtn.dataset.role; S.rmenu = false;
    if(lvl(scr(S.screen)) === 'none' && S.hideOff) S.screen = SCREENS[0].id;
    render(); return;
  }
  const pinEl = e.target.closest('[data-pin]');
  if(pinEl){ const n = +pinEl.dataset.pin; S.pinSel = (S.pinSel === n ? null : n); S.pinFocus = n; render(); return; }
  const pg = S.pen && e.target.closest('.page');
  if(pg){                                   /* matita accesa: il clic segna, non naviga */
    snap('segno');
    const blk = e.target.closest('[data-uxk]');
    const box = blk || pg, r = box.getBoundingClientRect(), l = pinsOf(scr(S.screen));
    const np = {b:blk ? +blk.dataset.uxk : null,
                x:+(((e.clientX - r.left) / r.width) * 100).toFixed(2),
                y:+(((e.clientY - r.top) / r.height) * 100).toFixed(2), t:''};
    if(S.mob) np.m = 1;
    l.push(np);
    S.pinSel = S.pinFocus = l.length - 1;
    e.preventDefault(); render(); return;
  }
  if(S.draw && e.target.closest('.page')) return;       /* matita accesa: il clic disegna */
  if(S.txt && e.target.closest('[data-txo]')) return;   /* modo testi: il clic mette il cursore */
  const blockedBtn = e.target.closest('[aria-disabled="true"]');
  if(blockedBtn){ toast(blockedBtn.dataset.why, true); return; }
  const xBtn = e.target.closest('[data-xdo]');
  if(xBtn){
    const v = xBtn.dataset.xdo;
    if(v === 'export'){ exportHtml(); return; }
    if(v === 'spec'){ specWrite(); return; }
    if(v === 'menu'){ S.menu = !S.menu; render(); return; }
    if(v === 'rmenu'){ S.rmenu = !S.rmenu; render(); return; }
    if(v === 'opts'){ S.opts = !S.opts; render(); return; }
    if(v.slice(0, 3) === 'at:'){ S.atool = v.slice(3); if(S.atool !== 'sel') S.asel = null; render(); return; }
    if(v === 'adelsel'){ arcDel(); return; }
    if(v === 'az:in'){  arcZoom(S.arc.z * 1.25); return; }
    if(v === 'az:out'){ arcZoom(S.arc.z / 1.25); return; }
    if(v === 'az:fit'){ arcFit(); return; }
    if(v === 'aclear'){ snap('pulisci la tela'); S.arc.ink = []; S.arc.txt = []; S.asel = null; render(); return; }
    if(v.slice(0, 5) === 'adel:'){ snap('togli appunto'); S.arc.txt.splice(+v.slice(5), 1); render(); return; }
    if(v === 'undo'){ undo(); render(); return; }
    if(v === 'redo'){ redo(); render(); return; }
    if(v.slice(0, 3) === 'rg:'){ const g = v.slice(3);
      S.rg[g] = !(g in S.rg ? S.rg[g] : g === scr(S.screen).g); render(); return; }
    if(v === 'flt0'){ S.filtro = ''; S.ff = true; render(); return; }
    if(v.indexOf('m:') === 0){ setMode(v.slice(2)); render(); }
    return;
  }
  const fBtn = e.target.closest('[data-fdo]');
  if(fBtn){ flowDo(fBtn.dataset.fdo, fBtn.dataset.farg); render(); return; }
  const fLink = e.target.closest('[data-flow]');
  if(fLink){ flowEnter(fLink.dataset.flow); render(); return; }
  const sm = e.target.closest('.pb>summary');
  if(sm){ S.pb[sm.parentElement.dataset.pb] = !sm.parentElement.open; return; }
  const uxBtn = e.target.closest('[data-uxdo]');
  if(uxBtn){ uxDo(uxBtn.dataset.uxdo, uxBtn.dataset.uxi); render(); return; }
  const uxSel = e.target.closest('[data-uxsel]');
  if(uxSel){
    const n = +uxSel.dataset.uxsel;
    S.from = uxSel.closest('aside.side') ? 'side' : 'canvas';
    S.uxSel = (S.uxSel === n ? null : n);
    render(); return;
  }
  const navLink = e.target.closest('[data-screen]');
  if(navLink){ S.screen = navLink.dataset.screen; S.uxSel = null; S.menu = false; S.arch = false; render(); return; }
  const btn = e.target.closest('[data-do]');
  if(btn && btn.tagName !== 'INPUT'){
    const fn = DO[btn.dataset.do];
    if(fn){ fn(btn.dataset.arg); render(); }
    return;
  }
});
document.addEventListener('focusin', e => {
  if(e.target.closest('[data-txo]')) snap('testo');
  else if(e.target.closest('[data-uxf],[data-pinf]')) snap('appunto');
});
document.addEventListener('input', e => {
  if(e.target.id === 'rFlt'){ S.filtro = e.target.value; S.ff = true; render(); return; }
  const f = e.target.closest('[data-uxf]');
  if(f) uxSet(f.dataset.uxi, f.dataset.uxf, f.textContent.trim());
  const t = e.target.closest('[data-txo]');
  if(t) txtSet(t);
  const g = e.target.closest('[data-pinf]');
  if(g){ const pn = pinsOf(scr(S.screen))[+g.dataset.pinf]; if(pn) pn.t = g.textContent.trim(); }
});
/* ridisegna solo quando il fuoco esce davvero dai campi, per non perdere il cursore */
document.addEventListener('focusout', e => {
  if(!e.target.closest('[data-uxf]') && !e.target.closest('[data-pinf]') && !e.target.closest('[data-txo]')) return;
  setTimeout(() => {
    const a = document.activeElement;
    if(!a || (!a.closest('[data-uxf]') && !a.closest('[data-pinf]') && !a.closest('[data-txo]'))) render();
  }, 0);
});
/* ── trascinamento delle sezioni ── */
document.addEventListener('dragstart', e => {
  const h = e.target.closest('[data-uxdrag]');
  if(!h) return;
  S.drag = +h.dataset.uxdrag;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(S.drag)); }catch(x){}
});
document.addEventListener('dragover', e => {
  if(S.drag == null) return;
  const t = e.target.closest('[data-uxdrop]');
  if(!t || +t.dataset.uxdrop === S.drag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(t.classList.contains('dragover')) return;
  document.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover'));
  t.classList.add('dragover');
});
document.addEventListener('drop', e => {
  const t = S.drag != null && e.target.closest('[data-uxdrop]');
  if(!t) return;
  e.preventDefault();
  uxMove(S.drag, +t.dataset.uxdrop);
  S.drag = null;
  render();
});
document.addEventListener('dragend', () => {
  if(S.drag == null) return;
  S.drag = null;
  document.querySelectorAll('.dragover').forEach(x => x.classList.remove('dragover'));
});
document.addEventListener('change', e => {
  if(e.target.dataset && e.target.dataset.uxt != null){ uxSet(e.target.dataset.uxt, 't', e.target.value); render(); return; }
  if(e.target.tagName === 'INPUT' && e.target.dataset.do === 'task'){ DO.task(e.target.dataset.arg); render(); return; }
});


/* tastiera: 1-4 i modi, F schermo pulito, Esc annulla selezione e posa la matita */
document.addEventListener('keydown', e => {
  const tt = e.target;
  const pf = tt && tt.closest && tt.closest('[data-pinf]');
  if(pf && e.key === 'Enter'){          /* invio: il segno e' a posto */
    e.preventDefault();
    S.pinLast = +pf.dataset.pinf; S.pinSel = null;
    render(); return;
  }
  if(S.arch && S.asel && !(tt && (tt.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(tt.tagName || ''))) &&
     (e.key === 'Backspace' || e.key === 'Delete')){
    e.preventDefault(); arcDel(); return;
  }
  /* invio: l'appunto e' scritto. A capo con maiuscolo+invio, come in una chat. */
  const an = tt && tt.closest && tt.closest('[data-anote]');
  if(an && (e.key === 'Enter' && !e.shiftKey || e.key === 'Escape')){
    e.preventDefault();
    if(tt.blur) tt.blur();
    return;
  }
  const scrive = tt && (tt.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(tt.tagName || ''));
  if((e.metaKey || e.ctrlKey) && (e.key || '').toLowerCase() === 'z'){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    render(); return;
  }
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  /* canc subito dopo: toglie il segno appena messo */
  if(!scrive && S.pinLast != null && (e.key === 'Delete' || e.key === 'Backspace')){
    e.preventDefault();
    snap('togli segno');
    pinsOf(scr(S.screen)).splice(S.pinLast, 1);
    S.pinLast = null; S.pinSel = null;
    render(); return;
  }
  if(!scrive && (e.key === '[' || e.key === ']')){
    const open = SCREENS.filter(x => lvl(x) !== 'none');
    const i = open.findIndex(x => x.id === S.screen);
    const n = open[(i + (e.key === ']' ? 1 : -1) + open.length) % open.length];
    if(n){ S.screen = n.id; S.uxSel = null; render(); }
    return;
  }
  const t = e.target;
  if(t && (t.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName || ''))) return;
  const k = (e.key || '').toLowerCase();
  if(k === 'escape'){ S.uxSel = S.pinSel = null; S.pal = false; S.pen = S.draw = S.arch = false; S.menu = S.rmenu = S.opts = false; render(); return; }
  const m = {'1':'edit', '2':'pen', '3':'draw', 'f':'solo', 'm':'mob', 'a':'arch'}[k];
  if(!m) return;
  e.preventDefault();
  setMode(m);
  render();
});

/* ── AVVIO ───────────────────────────────────────── */
function start(){
  grabSource();
  S.role = S.role || ROLES[0].id;
  S.screen = S.screen || SCREENS[0].id;
  document.title = BRAND.name + ' — ' + (BRAND.tag || 'wireframe');
  if(!S.seeded && stLoad())
    setTimeout(() => toast('Ripreso il lavoro salvato in questo browser. Per ripartire pulito: pannello destro \u2192 Lavoro salvato \u2192 Scarta.'), 300);
  if(BRAND.cookie) DO.ck = function(a){
    S.ck = true;
    /* 'skip' non e' una scelta dell'utente finale: e' chi disegna che si toglie il
       banner di mezzo, quindi non finisce nel registro come un consenso */
    if(a === 'skip'){ toast('Banner nascosto per questa sessione. Ricarica per rivederlo.'); return; }
    log('Consenso cookie: ' + (a === 'ok' ? 'tutti accettati' : a === 'no' ? 'solo tecnici' : 'preferenze salvate'));
    toast(a === 'ok' ? 'Consenso completo registrato.' : 'Consenso limitato ai cookie tecnici.');
  };
  render();
}
/* KIT — mattoni per scrivere le view componendo invece di battere HTML.
   Ogni funzione torna una stringa. Nulla e' obbligatorio: dentro una view puoi
   sempre scrivere HTML a mano, e puoi mescolare le due cose. */

const h = x => Array.isArray(x) ? x.join('') : (x == null ? '' : x);

/* ── impalcature ─────────────────────────────────── */
function sec(title, body, meta){
  return '<div class="sec">' + (title ? '<h3>' + title + (meta ? '<em>' + meta + '</em>' : '') + '</h3>' : '') + h(body) + '</div>';
}
function row(n, items){ return '<div class="row c' + n + '">' + h(items) + '</div>'; }
function split(main, aside){ return '<div class="split"><div>' + h(main) + '</div><div>' + h(aside) + '</div></div>'; }
function acts(btns){ return '<div class="acts">' + h(btns) + '</div>'; }

/* ── contenuti ───────────────────────────────────── */
function box(o){
  o = o || {};
  return '<article class="box' + (o.flat ? ' flat' : '') + '">' +
    (o.thumb ? '<div class="thumb">' + o.thumb + '</div>' : '') +
    (o.kick ? '<div class="mono mut">' + o.kick + '</div>' : '') +
    (o.h ? '<h4>' + o.h + '</h4>' : '') +
    (o.p ? '<p>' + o.p + '</p>' : '') +
    h(o.body) +
    (o.meta ? '<div class="meta">' + o.meta + '</div>' : '') +
    (o.acts ? acts(o.acts) : '') +
  '</article>';
}
/* elenco: {t titolo, s sottotitolo, r roba a destra (tag, pulsanti)} */
function lst(items){
  return '<ul class="lst">' + items.map(i =>
    '<li><span class="g"><b>' + i.t + '</b>' + (i.s ? '<small>' + i.s + '</small>' : '') + '</span>' +
    (i.r ? '<span class="r">' + h(i.r) + '</span>' : '') + '</li>').join('') + '</ul>';
}
/* tabella: cols = ['Nome','Stato'], rows = [['Rossi', tag('attivo')], …] */
function tbl(o){
  const rows = o.rows || [];
  return '<div class="tbl">' +
    (o.tools || o.n !== undefined
      ? '<div class="tools">' + h(o.tools) + (o.n !== undefined ? '<span class="n">' + o.n + '</span>' : '') + '</div>'
      : '') +
    '<div class="scr"><table class="tb"><thead><tr>' + (o.cols || []).map(c => '<th>' + c + '</th>').join('') + '</tr></thead>' +
    '<tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + h(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></div>';
}
function filt(label, wide){ return '<span class="f' + (wide ? ' s' : '') + '">' + label + '</span>'; }
function tag(t, k){ return '<span class="tag' + (k ? ' ' + k : '') + '">' + t + '</span>'; }
function note(t){ return '<div class="note">' + t + '</div>'; }
/* segno editoriale: annotazione a mano, numerazione, freccia. Sta dentro una riga
   di testo o accanto a un'immagine. Non e' la matita rossa: quella e' uno strumento
   dell'editor, questo e' un elemento del wireframe. k: 'n' (numerato) | 'ar' (freccia). */
function mark(t, k){ return '<span class="mk' + (k ? ' ' + k : '') + '">' + t + '</span>'; }
function empty(t){ return '<div class="empty">' + t + '</div>'; }
function bar(pct, meta){ return '<div class="bar"><i style="width:' + pct + '%"></i></div>' + (meta ? '<div class="meta">' + meta + '</div>' : ''); }
/* k:'hd' = linee da titolo, spesse: servono allo skeleton per dire dove sta il peso */
function lines(n, k){ return '<div class="lines' + (k ? ' ' + k : '') + '">' + '<i></i>'.repeat(n || 4) + '</div>'; }

/* ── moduli ──────────────────────────────────────── */
function fld(o){
  const lab = '<label>' + o.label + '</label>';
  const hint = o.hint ? '<div class="hint">' + o.hint + '</div>' : '';
  if(o.options) return '<div class="fld">' + lab + '<select>' + o.options.map(x => '<option>' + x + '</option>').join('') + '</select>' + hint + '</div>';
  if(o.area)    return '<div class="fld">' + lab + '<textarea placeholder="' + (o.ph || '') + '"></textarea>' + hint + '</div>';
  return '<div class="fld">' + lab + '<input placeholder="' + (o.ph || '') + '">' + hint + '</div>';
}
function form(fields, btns){ return fields.map(fld).join('') + (btns ? acts(btns) : ''); }

/* ── sezioni da sito pubblico ────────────────────── */
function hero(o){
  return '<section class="hero' + (o.mm ? ' mm' : '') + '"><div>' +
    (o.kick ? '<div class="kick">' + o.kick + '</div>' : '') +
    '<h1>' + o.h + '</h1>' + (o.p ? '<p>' + o.p + '</p>' : '') +
    (o.acts ? acts(o.acts) : '') +
    (o.trust ? '<div class="trust">' + o.trust.map(t => '<div><b>' + t[0] + '</b>' + t[1] + '</div>').join('') + '</div>' : '') +
  '</div>' + (o.media || ph('IMMAGINE HERO · 4:3', 'tall x')) + '</section>';
}
function band(o){
  return '<section class="band' + (o.alt ? ' alt' : '') + (o.mm ? ' mm' : '') + '">' +
    (o.h || o.kick ? '<header><div>' +
      (o.kick ? '<div class="kick">' + o.kick + '</div>' : '') +
      (o.h ? '<h2>' + o.h + '</h2>' : '') +
      (o.p ? '<p>' + o.p + '</p>' : '') +
    '</div>' + (o.acts ? '<div class="acts" style="margin:0">' + h(o.acts) + '</div>' : '') + '</header>' : '') +
    h(o.body) + '</section>';
}
function cta(o){
  return '<section class="band cta"><div><h2>' + o.h + '</h2>' + (o.p ? '<p>' + o.p + '</p>' : '') + '</div>' +
    '<div class="acts" style="margin:0">' + h(o.acts) + '</div></section>';
}
/* fascia di schede: la forma piu' frequente di tutte */
function cards(o){
  return band({kick:o.kick, h:o.h, p:o.p, alt:o.alt, mm:o.mm, acts:o.acts,
               body:row(o.n || (o.items.length === 2 ? 2 : 3), o.items.map(box))});
}
/* passi numerati, in schede piatte */
function steps(items, o){
  o = o || {};
  return band({kick:o.kick, h:o.h, alt:o.alt,
    body:row(items.length > 3 ? 4 : items.length, items.map((x, i) =>
      box({flat:true, kick:String(i + 1).padStart(2, '0'), h:x.h, p:x.p})))});
}
/* griglia irregolare: sei colonne, e ogni voce dice quante ne occupa.
   {c} colonne (1-6), {t} testo del segnaposto, {tall} piu' alta, {cap} didascalia,
   {off} sborda oltre il margine della fascia, {body} contenuto al posto dell'immagine.
   Una voce {v:true} e' un vuoto intenzionale: lo spazio bianco e' parte della
   composizione, non quello che avanza. */
function grid(items, o){
  o = o || {};
  return band({kick:o.kick, h:o.h, p:o.p, alt:o.alt, mm:o.mm, acts:o.acts,
    body:'<div class="grd">' + items.map(i =>
      i.v ? '<div class="gv" style="grid-column:span ' + (i.c || 2) + '"></div>'
          : '<figure class="gi' + (i.off ? ' off' : '') + '" style="grid-column:span ' + (i.c || 3) + '">' +
            (i.body || ph(i.t || 'immagine', (i.tall ? 'tall' : 'wide') + ' x')) +
            (i.cap ? '<figcaption>' + i.cap + '</figcaption>' : '') + '</figure>').join('') + '</div>'});
}
function faq(items, o){
  o = o || {};
  return band({kick:o.kick || 'Domande ricorrenti', h:o.h, alt:o.alt,
    body:row(2, items.map(x => box({h:x.q, p:x.a})))});
}

/* ── skeleton, pannelli, spazi 3D ─────────────────── */
/* SKELETON — l'ingombro di una sezione senza testo da leggere: si guarda la densita'
   e il bilanciamento, non le parole. Ogni voce e' una riga:
   'h' titolo (linea spessa) · 'p' paragrafo (quattro linee sottili) · 'p2' due righe ·
   'img' immagine barrata · {i:n} n immagini affiancate · {c:[…]} colonne uguali ·
   {s:[principale, laterale]} colonna larga + laterale, le proporzioni di un back-office. */
function skel(items){
  const one = x => typeof x !== 'string'
      ? (x.c ? row(x.c.length, x.c.map(col))
      :  x.s ? split(col(x.s[0]), col(x.s[1]))
      :  x.i ? row(x.i, new Array(x.i).fill(0).map(() => ph('', 'wide x'))) : '')
    : x === 'h'   ? lines(1, 'hd')
    : x === 'img' ? ph('', 'wide x')
    : lines(x === 'p2' ? 2 : 4);
  const col = c => Array.isArray(c) ? c.map(one).join('') : one(c);
  return '<div class="skel">' + items.map(one).join('') + '</div>';
}

/* PANNELLO A SCOMPARSA (carrello, filtri, dettaglio rapido) — non e' una finestra
   vera, e' il disegno di una: la pagina sotto resta visibile e attenuata, cosi' si
   vede cosa copre e quanto. {h} titolo, {body} contenuto, {foot} riga fissa in
   fondo (totale e azione), {behind} cosa c'e' sotto (default: uno skeleton). */
function drawer(o){
  return '<section class="drw">' +
    '<div class="bg">' + (o.behind || skel(['h', 'p', {i:3}])) + '</div>' +
    '<aside class="pn"><header><h4>' + (o.h || 'Pannello') + '</h4><span class="x">chiudi</span></header>' +
      '<div class="bd">' + h(o.body) + '</div>' +
      (o.foot ? '<div class="ft">' + h(o.foot) + '</div>' : '') +
    '</aside></section>';
}

/* MODALE — interrompe e chiede una cosa sola. Come drawer(), non e' una finestra
   vera: e' il disegno di una, con la pagina sotto visibile attraverso lo strato
   scuro, cosi' si vede cosa la modale sta interrompendo.
   {h} titolo, {body} la domanda, {foot} le risposte (il primario sta a destra),
   {wide} piu' larga, {behind} cosa c'e' sotto (default: uno skeleton). */
function modal(o){
  return '<section class="mdl">' +
    '<div class="bg">' + (o.behind || skel(['h', 'p', {i:3}])) + '</div>' +
    '<div class="dlg' + (o.wide ? ' wide' : '') + '">' +
      '<header><h4>' + (o.h || 'Conferma') + '</h4><span class="x">chiudi</span></header>' +
      '<div class="bd">' + h(o.body) + '</div>' +
      (o.foot ? '<div class="ft">' + h(o.foot) + '</div>' : '') +
    '</div></section>';
}

/* SPAZIO 3D A TUTTO SCHERMO — l'ambiente occupa tutto, l'interfaccia galleggia ai
   bordi e resta minima. {tl}{tr}{bl}{br} sono i quattro angoli, {mid} la sola cosa
   al centro, {amb} il segnaposto dell'ambiente. Si riempiono solo gli slot che servono. */
function hud(o){
  return '<section class="hud">' + (o.amb || canvas3d({full:true, t:'[ AMBIENTE 3D INTERATTIVO ]', st:o.st})) +
    ['tl', 'tr', 'bl', 'br'].map(k => o[k] ? '<div class="' + k + '">' + h(o[k]) + '</div>' : '').join('') +
    (o.mid ? '<div class="mid">' + h(o.mid) + '</div>' : '') + '</section>';
}

/* CANVAS 3D — il posto dell'oggetto, non l'oggetto. Il bordo e' marcato apposta,
   diverso da quello di ph(): dentro renderizza il motore (WebGL, Spline), fuori e'
   HTML. Guardando il wireframe si deve capire dove passa il confine.
   {t} la dicitura, {st} lo stato di rotazione o animazione, {tall} piu' alto,
   {full} riempie il genitore (dentro hud() o dietro scrolly()). */
function canvas3d(o){
  o = o || {};
  return '<div class="c3d' + (o.tall ? ' tall' : '') + (o.full ? ' full' : '') + '">' +
    '<span class="tp">WebGL</span>' +
    '<div class="lb">' + (o.t || '[ 3D CANVAS · SCENE BACKGROUND ]') + '</div>' +
    (o.st ? '<div class="st">' + o.st + '</div>' : '') + h(o.body) + '</div>';
}

/* 3D ALLO SCROLL — il canvas resta fermo dietro, il testo gli passa davanti e si
   alterna a destra e a sinistra: il centro della scena non si copre mai.
   {h} titolo, {canvas} cosa sta dietro, {pct}+{meta} l'avanzamento in fondo,
   {steps:[{h, p, st, kick, side:'l'|'r'}]} le tappe — `st` dice cosa fa il modello
   in quel punto, che e' la sola cosa che un wireframe puo' dire di un'animazione.
   `side` si alterna da solo; `kick:false` toglie la numerazione. */
function scrolly(o){
  const steps = (o.steps || []).map((x, i) =>
    '<div class="sy-b ' + (x.side || (i % 2 ? 'r' : 'l')) + '">' +
      box({kick:x.kick === false ? '' : (x.kick || 'tappa ' + String(i + 1).padStart(2, '0')),
           h:x.h, p:x.p, meta:x.st, body:x.body}) + '</div>').join('');
  return '<section class="sy">' +
    '<div class="bgl">' + (o.canvas || canvas3d({full:true, st:o.st})) + '</div>' +
    '<div class="ly">' + (o.h ? '<header><h2>' + o.h + '</h2></header>' : '') + steps + '</div>' +
    (o.pct === undefined ? '' : '<div class="pg">' + bar(o.pct, o.meta || 'avanzamento dello scroll') + '</div>') +
  '</section>';
}

/* SELETTORE DI VARIANTI — colori, materiali, tagli. Il quadratino e' un segnaposto,
   non un colore vero: nel wireframe non c'e' brand. Sta bene su una scheda prodotto
   e su un bordo di HUD. {t} etichetta, {on} quello scelto. */
function swatch(items, o){
  o = o || {};
  return '<div class="sw">' + (o.label ? '<span class="lb">' + o.label + '</span>' : '') +
    items.map(x => '<span class="it' + (x.on ? ' on' : '') + '"><i></i>' + (x.t || '') + '</span>').join('') + '</div>';
}
/* EDITOR — guscio senza progetto dentro. Apre un progetti/<nome>/spec.js scelto
   dall'utente e da li' in poi e' il motore normale: ruoli, flussi, sezioni, segni,
   testi, export. Il file non esce dal browser: niente rete, niente server. */
const ED = {main:'', name:'', loaded:false};
let SPECSRC = null;

function edLanding(msg){
  document.body.innerHTML =
    '<div class="ed"><div class="card">' +
      '<div class="logo"><i></i>Editor wireframe</div>' +
      '<h1>Apri un progetto</h1>' +
      '<p>Scegli il file <span class="mono">spec.js</span> del progetto: <span class="mono">progetti/&lt;nome&gt;/spec.js</span>.</p>' +
      '<label class="btn pri">Scegli il file<input type="file" id="edF" accept=".js,text/javascript" hidden></label>' +
      '<p class="mut">oppure trascina il file qui dentro</p>' +
      (msg ? '<div class="note red">' + msg + '</div>' : '') +
      '<div class="list"></div>' +
      '<div class="note">Dentro ci sono motore e kit al completo: ruoli e permessi, flussi, editor delle sezioni, matita rossa, testi, e <b>Condividi ↓</b> che salva un file unico apribile offline. Il progetto resta sul tuo computer.</div>' +
    '</div></div>';
}

/* Un progetto per volta. Se l'indirizzo porta gia' un ?spec=, ricaricare riapre
   quello di prima: il modo di cambiare progetto e' tornare alla home senza query. */
function edBusy(){
  const q = typeof location !== 'undefined' && /[?&]spec=/.test(location.search || '');
  return 'Un progetto è già aperto: ' + ED.name + '. ' + (q
    ? 'Per aprirne un altro torna alla <a href="./">home del sito</a>: ricaricare questa pagina riaprirebbe lo stesso.'
    : 'Ricarica la pagina per aprirne un altro.');
}

/* apre uno spec gia' letto: da file scelto a mano o preso da un indirizzo */
function edApply(name, src){
  if(ED.loaded) return edLanding(edBusy());
  if(!/SCREENS\s*=/.test(src) || !/ROLES\s*=/.test(src))
    return edLanding('Questo non sembra uno spec di wireframe: dentro non ci sono ROLES e SCREENS.');
  const el = document.createElement('script');
  el.textContent = src;
  document.body.appendChild(el);
  if(typeof SCREENS === 'undefined' || typeof ROLES === 'undefined')
    return edLanding('Il file non si è caricato: guarda la console del browser per l’errore.');
  /* ED.loaded si alza solo a progetto disegnato: se start() esplode restiamo sulla
     schermata di scelta, e quella deve continuare a funzionare. Altrimenti il guscio
     si crede pieno mentre e' vuoto, e rifiuta ogni file senza dire perche'. */
  ED.name = name; SPECSRC = src;
  try{ start(); }
  catch(err){
    ED.name = ''; SPECSRC = null;
    console.error(err);
    return edLanding('Il progetto si è caricato ma non si è disegnato: ' + (err && err.message || err) +
                     '. L’errore per esteso è nella console del browser.');
  }
  ED.loaded = true;
  /* l'export ricuce il file da qui: motore + kit + progetto + start() */
  SRC.css = (document.querySelector('style') || {textContent:''}).textContent || '';
  SRC.js = ED.main + '\n' + src + '\nstart();\n';
  toast('Progetto aperto: ' + name + ' — ' + SCREENS.length + ' schermate, ' + ROLES.length + ' ruoli.');
}
function edLoad(file){
  if(!file) return;
  const r = new FileReader();
  r.onerror = () => edLanding('Non sono riuscito a leggere il file.');
  r.onload = () => edApply(file.name, String(r.result || ''));
  r.readAsText(file);
}
/* online: ?spec=<indirizzo> apre subito quel progetto, e specs/list.json (se c'e')
   diventa l'elenco dei progetti disponibili. In locale non cambia niente. */
function edFetch(url, name){
  fetch(url).then(r => r.ok ? r.text() : Promise.reject(r.status))
    .then(t => edApply(name || url.split('/').pop(), t))
    .catch(e => edLanding('Non sono riuscito ad aprire ' + url + ' (' + e + ').'));
}
function edBoot(){
  /* fuori da un browser (o senza fetch) non c'e' niente da aprire da solo */
  if(typeof location === 'undefined' || typeof fetch !== 'function') return;
  const q = (location.search.match(/[?&]spec=([^&]+)/) || [])[1];
  if(q) return edFetch(decodeURIComponent(q));
  if(!/^https?:/.test(location.protocol)) return;
  fetch('specs/list.json').then(r => r.ok ? r.json() : Promise.reject())
    .then(l => {
      if(!l || !l.length || ED.loaded) return;
      const box = document.querySelector('.ed .list');
      if(!box) return;
      box.innerHTML = '<div class="t">Progetti su questo sito</div>' + l.map(x =>
        '<a class="btn" href="?spec=' + encodeURIComponent('specs/' + x.file) + '">' + x.name +
          '<small>' + (x.screens || '?') + ' schermate</small></a>').join('');
    }).catch(() => {});
}

document.addEventListener('change', e => { if(e.target.id === 'edF') edLoad(e.target.files[0]); });
document.addEventListener('dragover', e => { if(!ED.loaded){ e.preventDefault(); document.body.classList.add('edrop'); } });
document.addEventListener('dragleave', () => document.body.classList.remove('edrop'));
document.addEventListener('drop', e => {
  if(ED.loaded) return;
  e.preventDefault();
  document.body.classList.remove('edrop');
  edLoad((e.dataTransfer.files || [])[0]);
});

ED.main = (document.querySelector('script') || {textContent:''}).textContent || '';
edLanding('');
edBoot();

/* ── RISCRITTURA DELLO SPEC ──────────────────────────
   L'editor tiene il sorgente del file che gli hai dato, quindi può restituirtelo
   aggiornato: testi sostituiti, blocchi ux e pins scritti dentro la schermata giusta.
   ponytail: è uno scanner, non un parser JS. Salta commenti e stringhe — che è il
   90% dei casi in cui sbaglierebbe — ma davanti a un file scritto in modo strano
   può non trovare il punto. Per questo scarica sempre un file NUOVO, mai sovrascrive:
   si valida con `sh tools/check.sh` prima di metterlo al posto dell'originale. */

/* indice subito dopo la parentesi che chiude quella aperta in `from` */
function srcSpan(src, from, open, close){
  let d = 0, q = null;
  for(let i = from; i < src.length; i++){
    const c = src[i], n = src[i + 1];
    if(q){ if(c === '\\') i++; else if(c === q) q = null; continue; }
    if(c === '/' && n === '*'){ const e = src.indexOf('*/', i + 2); i = e < 0 ? src.length : e + 1; continue; }
    if(c === '/' && n === '/'){ const e = src.indexOf('\n', i);     i = e < 0 ? src.length : e;     continue; }
    if(c === "'" || c === '"' || c === '`'){ q = c; continue; }
    if(c === open) d++;
    else if(c === close && --d === 0) return i + 1;
  }
  return -1;
}
/* estensione dell'oggetto schermata {id:'home', … } */
function specScreen(src, id){
  const m = new RegExp("\\{\\s*id\\s*:\\s*['\"]" + id + "['\"]").exec(src);
  if(!m) return null;
  const end = srcSpan(src, m.index, '{', '}');
  return end < 0 ? null : [m.index, end];
}
/* estensione di una proprieta' a lista (ux, pins) dentro la schermata */
function specProp(src, a, b, name){
  const m = new RegExp("[,{\\s]" + name + "\\s*:\\s*\\[").exec(src.slice(a, b));
  if(!m) return null;
  const br = a + m.index + m[0].length - 1;
  const end = srcSpan(src, br, '[', ']');
  return end < 0 ? null : [a + m.index + 1, end];
}
/* scrive la proprieta': sostituisce se c'e', altrimenti la mette prima di view() */
function specSet(src, id, name, text){
  const sp = specScreen(src, id);
  if(!sp) return {src:src, ok:false};
  const at = specProp(src, sp[0], sp[1], name);
  if(at) return {src:src.slice(0, at[0]) + text + src.slice(at[1]), ok:true};
  const mv = /\n([ \t]*)view\s*\(/.exec(src.slice(sp[0], sp[1]));
  const pos = mv ? sp[0] + mv.index + 1 : sp[1] - 1;
  const ind = mv ? mv[1] : ' ';
  return {src:src.slice(0, pos) + ind + text + ',\n' + src.slice(pos), ok:true};
}
const specQ = t => "'" + String(t).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";

function specUxText(s, ind){
  const l = uxDumpList(s);
  if(!l.length) return null;
  const arr = a => '[' + a.map(specQ).join(', ') + ']';
  return 'ux:[\n' + l.map(u => ind + ' {n:' + specQ(u.n) + (u.st !== 'ok' ? ', st:' + specQ(u.st) : '') +
      (u.t ? ', t:' + specQ(u.t) : '') + (u.roles ? ', roles:' + arr(u.roles) : '') + ', goal:' + specQ(u.goal) +
      (u.note.length ? ',\n' + ind + '  note:' + arr(u.note) : '') +
      (u.todo.length ? ',\n' + ind + '  todo:' + arr(u.todo) : '') + '}').join(',\n') + '\n' + ind + ']';
}
function specPinText(s, ind){
  const l = (S.pins[s.id] || []).filter(p => p.t);
  if(!l.length) return null;
  return 'pins:[\n' + l.map(p => ind + ' {' + (p.b != null ? 'b:' + p.b + ', ' : '') + 'x:' + p.x + ', y:' + p.y +
    (p.m ? ', m:1' : '') + ', t:' + specQ(p.t) + '}').join(',\n') + '\n' + ind + ']';
}

/* il file nuovo, piu' il resoconto di cosa e' entrato e cosa no */
function specBuild(){
  let src = SPECSRC, done = {txt:0, miss:[], ux:0, pins:0, bozze:[], vuote:[]};
  SCREENS.forEach(s => {
    const sp = specScreen(src, s.id);
    if(!sp) return;
    /* 1. testi: sostituzione dentro la sola schermata */
    const m = S.txtEd[s.id] || {};
    Object.keys(m).forEach(k => {
      const cur = specScreen(src, s.id);
      if(!cur) return;
      const body = src.slice(cur[0], cur[1]);
      if(body.indexOf(k) < 0){ done.miss.push(s.id + ': ' + k); return; }
      src = src.slice(0, cur[0]) + body.split(k).join(m[k]) + src.slice(cur[1]);
      done.txt++;
    });
    /* 2. ux e pins */
    const ind = ' ';
    const ux = (S.uxEd[s.id] && uxDiff(s)) ? specUxText(s, ind) : null;
    if(ux){ const r = specSet(src, s.id, 'ux', ux); src = r.src; if(r.ok) done.ux++; }
    const pins = specPinText(s, ind);
    if(pins){ const r = specSet(src, s.id, 'pins', pins); src = r.src; if(r.ok) done.pins++; }
    /* 3. sezioni nuove: restano da incollare a mano, ma la riga e' gia' scritta */
    (S.uxEd[s.id] || []).forEach(u => {
      if(!u.goal && (u.st === 'rivedi' || u.st === 'nuovo')) done.vuote.push(s.id + ': ' + u.n);
      if(u._k == null && u.t && UXK[u.t]) done.bozze.push(s.id + ': ' + UXK[u.t].s.replace('%H', specQ(u.n)).replace('%P', specQ(u.goal || '')));
    });
  });
  if(done.bozze.length)
    src += '\n/* SEZIONI NUOVE da incollare nella view() della schermata indicata:\n' +
           done.bozze.map(b => '   ' + b).join('\n') + '\n*/\n';
  return {src:src, done:done};
}

function specWrite(){
  if(typeof SPECSRC !== 'string'){ toast('Lo spec sorgente non è disponibile qui: usa dist/editor.html.', true); return; }
  const r = specBuild(), d = r.done;
  const name = (ED.name || 'spec').replace(/\.js$/, '') + '.nuovo.js';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([r.src], {type:'text/javascript'}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  const msg = name + ' — ' + d.txt + ' testi, ' + d.ux + ' blocchi ux, ' + d.pins + ' segni' +
    (d.bozze.length ? ', ' + d.bozze.length + ' sezioni nuove in coda al file' : '') +
    (d.miss.length ? '. ' + d.miss.length + ' testi non trovati (vedi console)' : '') +
    (d.vuote.length ? '. ' + d.vuote.length + ' sezioni senza scopo: il check le rifiuta finché non lo scrivi' : '');
  if(d.miss.length) console.log('Testi non trovati nel sorgente:\n' + d.miss.join('\n'));
  if(d.vuote.length) console.log('Sezioni senza scopo:\n' + d.vuote.join('\n'));
  log('Scaricato ' + name);
  toast(msg + '. Provalo con sh tools/check.sh prima di sostituire l’originale.', d.miss.length + d.vuote.length > 0);
}
</script>
